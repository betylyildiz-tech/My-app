<script>
(function () {
  // GitHub Pages statik barındırmadır, /api sunucusu yoktur. Bu istekleri ağa göndermeden
  // "kullanılamıyor" olarak yanıtla; uygulama kendi yerleşik örnek yanıtlarına geçer.
  var nativeFetch = window.fetch;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var path = url.replace(location.origin, '');
    if (path.indexOf('/api/') === 0) {
      var cap = path.indexOf('/api/capabilities') === 0;
      return Promise.resolve(new Response(cap ? 'null' : '{"code":"not_granted"}', {
        status: cap ? 200 : 503, headers: { 'Content-Type': 'application/json' }
      }));
    }
    return nativeFetch.apply(this, arguments);
  };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>

`],check:{q:`Which product evens out skin tone across the whole face?`,options:[`Concealer`,`A light base such as skin tint`,`Blush`],answer:1,why:`Base evens the overall tone; concealer only treats small areas.`},practice:`Lay out what you already own and sort it into the seven basics. Note what is missing.`,ask:`Help me build a starter kit within my budget, using what I already own.`},{id:`s2`,title:`Skin prep`,minutes:5,summary:`Makeup sits on skin, so the skin underneath decides how it looks and how long it lasts.`,sections:[{heading:`Moisturiser`,body:`Even oily skin needs water. Dry patches make base cling and flake. Use a gel texture if you are oily, a cream if you are dry.`},{heading:`Sunscreen`,body:`Use two finger-lengths of SPF 30 or higher for face and neck as your last skincare step. The SPF in foundation is not enough on its own, because nobody applies that much foundation.`},{heading:`Primer, if you need it`,points:[`Blurring primer: softens the look of pores.`,`Gripping primer: helps makeup last on long days.`,`Hydrating primer: helps on dry skin.`,`Skip primer if your makeup already lasts.`]},{heading:`Wait`,body:`Give skincare three to five minutes to settle. Applying base on wet skincare is the most common reason for patchy makeup.`}],mistakes:[`Applying base straight after moisturiser.`,`Using a heavy cream under makeup on oily skin.`],check:{q:`Why wait a few minutes after skincare?`,options:[`So products can settle and base does not slide`,`So the skin dries out`,`It does not matter`],answer:0,why:`Base applied over wet skincare moves around and looks patchy.`},practice:`Do your skincare, set a three-minute timer, and only then start makeup.`,ask:`Which moisturiser and SPF should I wear under makeup for my skin type?`},{id:`s3`,title:`Find your undertone and shade`,minutes:6,summary:`A shade that matches your tone and undertone disappears into skin. A wrong one looks like a mask.`,sections:[{heading:`Depth and undertone`,body:`Depth is how light or deep your skin is. Undertone is the colour underneath: cool (pink), warm (golden), neutral (both) or olive (green-grey).`},{heading:`Simple checks`,points:[`Silver jewellery flatters cool undertones; gold flatters warm.`,`If you burn easily and rarely tan, you are often cool or neutral.`,`Olive skin can look grey in pink-based shades and too orange in yellow-based ones.`]},{heading:`Matching a shade`,points:[`Swatch three shades in a line along your jaw, not your hand.`,`Check in daylight, by a window.`,`The shade that vanishes is yours.`,`Wait 15 minutes; some formulas darken slightly as they dry.`]}],mistakes:[`Matching to your hand or wrist.`,`Choosing a lighter shade to look brighter.`],check:{q:`Where should you test a foundation shade?`,options:[`Back of the hand`,`Along the jaw, in daylight`,`Inside the wrist`],answer:1,why:`The jaw connects face and neck, and daylight shows the true colour.`},practice:`Look at your jaw in daylight next to something white and decide whether you look more pink, golden or both.`,ask:`Help me find my undertone and a base shade family that suits me.`},{id:`s4`,title:`Choosing a base`,minutes:6,summary:`Base products differ in two ways: how much they cover and how they finish.`,sections:[{heading:`Coverage`,points:[`Sheer: skin tint or tinted moisturiser. Evens tone, skin shows through.`,`Light to medium: BB or CC cream, sheer foundation. Softens redness and unevenness.`,`Full: most foundations. Covers marks, but needs more careful blending.`]},{heading:`Finish`,points:[`Matte: no shine. Helpful for oily skin.`,`Satin or natural: looks like skin. Suits most people.`,`Dewy: glowy. Lovely on dry skin, can look greasy on oily skin.`]},{heading:`By skin type`,body:`Oily skin: matte or satin, oil-free. Dry skin: dewy or satin, hydrating. Combination: satin, with powder only where you shine.`}],mistakes:[`Choosing full coverage when you only need to even out a few areas.`],check:{q:`You have dry skin and want a natural look. Which base fits best?`,options:[`Full-coverage matte foundation`,`Hydrating skin tint or satin foundation`,`Loose powder only`],answer:1,why:`Hydrating, lighter bases move with dry skin instead of clinging.`},practice:`Look at your current base. Write down its coverage and finish, and whether it suits your skin type.`,ask:`Which base would you recommend for my skin type, tone and budget?`},{id:`s5`,title:`Applying base`,minutes:6,summary:`Thin layers, placed where you need them, look better than one thick layer everywhere.`,sections:[{heading:`Amount`,body:`Start with half a pump or a pea-sized amount. Dot it on the centre of the face, where most redness sits, and blend outwards.`},{heading:`Tools`,points:[`Fingers: quickest, warms the product, sheer finish.`,`Damp sponge: bounce, do not wipe. Gives the most skin-like finish.`,`Dense brush: buffs in small circles for more coverage.`]},{heading:`Order`,body:`Blend from the centre towards the hairline and down onto the jaw so there is no line. Add a second thin layer only where you still need it.`}],mistakes:[`Applying the same thickness everywhere.`,`Stopping at the jawline.`],check:{q:`How should you use a damp makeup sponge?`,options:[`Wipe across the skin`,`Bounce or press it into the skin`,`Use it dry`],answer:1,why:`Pressing blends without moving the product around.`},practice:`Apply base with half your usual amount today. Add more only where you still see unevenness.`,ask:`Talk me through applying my base with the products I own.`},{id:`s6`,title:`Concealer`,minutes:6,summary:`Concealer is for small areas. Two jobs need two approaches: brightening under the eyes and hiding spots.`,sections:[{heading:`Under the eyes`,body:`Choose one shade lighter than your base. Apply a small triangle or a few dots near the inner corner and outer edge, then tap with your ring finger or a sponge.`},{heading:`Spots and redness`,body:`Choose the exact shade of your skin. Dot it on the centre of the spot, wait 30 seconds, then tap only the edges.`},{heading:`Order`,body:`Apply concealer after base, so you use less of it. Set lightly with powder if it creases.`}],mistakes:[`Using a very light concealer on spots, which makes them stand out.`,`Rubbing instead of tapping.`],check:{q:`What shade of concealer hides a spot best?`,options:[`Two shades lighter than your skin`,`The same shade as your skin`,`A dark shade`],answer:1,why:`A lighter shade highlights; an exact match hides.`},practice:`Use concealer only under the eyes and on one spot. Notice how little you need.`,ask:`Which concealer and shade should I use for under-eyes and for spots?`},{id:`s7`,title:`Setting your makeup`,minutes:5,summary:`Powder and setting spray help makeup last. Use them where you need them, not everywhere.`,sections:[{heading:`Powder`,points:[`Translucent powder: no colour, sets without changing your shade.`,`Pressed powder: easy for touch-ups.`,`Use a fluffy brush and press it onto the T-zone and under the eyes.`]},{heading:`Setting spray`,body:`Mist from arm’s length after makeup, in an X and T shape. It melts powder into skin and helps everything last.`},{heading:`When to skip`,body:`Dry skin often needs only a touch of powder under the eyes, or none.`}],mistakes:[`Powdering the whole face heavily, which looks flat and dry.`],practice:`Powder only where you get shiny, then compare by midday.`,ask:`Should I use powder or setting spray with my skin type?`},{id:`s8`,title:`Blush, bronzer and highlighter`,minutes:7,summary:`Three cheek products with three different jobs.`,sections:[{heading:`Blush adds colour`,body:`Smile, place it on the top of the cheeks and blend up towards the temples. Peachy shades flatter warm undertones; soft pinks and roses flatter cool ones; deeper skin glows in berry, brick and terracotta.`},{heading:`Bronzer adds warmth`,body:`Choose one or two shades deeper than your skin. Sweep it where the sun would hit: forehead edges, cheekbones, jaw.`},{heading:`Highlighter adds light`,body:`A little on the top of the cheekbones, the inner corners of the eyes and the cupid’s bow. Skip it if you are oily and want a soft look.`},{heading:`Cream or powder`,body:`Cream goes on before powder and looks fresh. Powder goes on after powder and lasts longer. Never put cream over powder.`}],mistakes:[`Placing blush too low, which drags the face down.`,`Using a bronzer that is much too dark.`],check:{q:`Where does blush usually look best?`,options:[`Low on the cheeks, near the jaw`,`On the top of the cheeks, blended upward`,`On the nose only`],answer:1,why:`Higher placement lifts the face.`},practice:`Try blush higher than usual today and blend it up towards the temple.`,ask:`Which blush shade and placement suit my skin tone?`},{id:`s9`,title:`Brows`,minutes:6,summary:`Brows frame the face. The goal is fuller, not darker.`,sections:[{heading:`Products`,points:[`Pencil: precise, hair-like strokes. Best for gaps.`,`Powder: soft, filled look.`,`Gel: holds hairs in place; tinted gel adds colour.`]},{heading:`Shade`,body:`Choose one shade lighter than your hair if your hair is dark, and one shade darker if your hair is light. With grey or white hair, a soft taupe looks natural.`},{heading:`How`,body:`Brush the hairs up. Fill only the sparse areas with short, light strokes in the direction of growth. Keep the front of the brow lighter than the tail. Set with gel.`}],mistakes:[`Outlining the brow with a hard line.`,`Using a shade darker than your hair.`],practice:`Fill only the gaps in your brows today, then brush through.`,ask:`Which brow product and shade suit my hair colour?`},{id:`s10`,title:`Eyeshadow basics`,minutes:7,summary:`One matte shade, blended well, is a complete eye look.`,sections:[{heading:`Start simple`,body:`A soft matte brown or taupe one or two shades deeper than your skin works for almost everyone. Sweep it across the lid with a fluffy brush and blend just above the crease.`},{heading:`Brushes`,points:[`Flat brush: packs colour onto the lid.`,`Fluffy brush: blends edges.`,`Small pencil brush: smudges colour along the lash line.`]},{heading:`Colours for your eyes`,body:`Warm browns and copper make blue eyes stand out; plum and mauve flatter green and hazel; brown eyes suit almost everything, especially bronze and navy.`}],mistakes:[`Not blending the edge, which leaves a hard line.`,`Starting with very shimmery shades.`],check:{q:`Which brush softens the edge of eyeshadow?`,options:[`A flat brush`,`A fluffy blending brush`,`A sponge`],answer:1,why:`A fluffy brush diffuses colour into the skin.`},practice:`Wear one matte shade across the lid and blend until there is no edge.`,ask:`Which eyeshadow shades bring out my eye colour?`},{id:`s11`,title:`Eyeliner and mascara`,minutes:7,summary:`Small steps that define the eyes the most.`,sections:[{heading:`Curl first`,body:`Curl lashes before mascara: hold the curler at the base for five seconds, then halfway along for five more.`},{heading:`Mascara`,body:`Wiggle the wand at the root, then pull through to the tips. Add a second coat while the first is still wet. Lengthening formulas suit short lashes; volumising suits fine ones.`},{heading:`Liner, gently`,body:`Start with a soft brown pencil. Tightline by pressing it into the upper lash line from underneath. It makes lashes look thicker without a visible line.`}],mistakes:[`Pumping the mascara wand, which dries the formula.`,`Curling after mascara, which can break lashes.`],practice:`Curl, then two coats of mascara. Try tightlining with a brown pencil.`,ask:`Which mascara and liner suit my lashes and eye colour?`},{id:`s12`,title:`Lips`,minutes:6,summary:`The easiest place to play with colour.`,sections:[{heading:`Formulas`,points:[`Tinted balm: sheer and comfortable.`,`Gloss: shine, easy to wear, needs reapplying.`,`Satin lipstick: colour with comfort.`,`Matte lipstick: lasts longest, can dry lips.`]},{heading:`Your nude`,body:`A flattering nude is one or two shades deeper than your lips, not paler. Pinkish nudes suit cool undertones; peachy and caramel nudes suit warm ones; deeper skin glows in brown and rosewood nudes.`},{heading:`Liner`,body:`Line just on the natural edge, then blend inwards so there is no visible line. It stops colour moving.`}],mistakes:[`Choosing a nude paler than your lips, which can look washed out.`],practice:`Find the lip shade closest to your natural lip colour and wear it all day.`,ask:`Which lip shades flatter my undertone?`},{id:`s13`,title:`Tools and hygiene`,minutes:5,summary:`Clean tools make makeup look better and keep skin calmer.`,sections:[{heading:`Cleaning`,points:[`Sponges: wash after every use, replace every one to three months.`,`Face brushes: wash weekly with gentle soap, dry flat.`,`Eye brushes: wash every week or two.`]},{heading:`Expiry`,body:`Look for the open-jar symbol with a number such as 6M or 12M: that is how many months a product lasts after opening. Mascara lasts about three months.`},{heading:`Never share`,body:`Eye products and lip products spread infections. Keep them your own.`}],practice:`Wash your sponge and face brushes today. Check the open-jar symbol on your mascara.`,ask:`How should I store and clean my makeup tools?`},{id:`s14`,title:`Your five-minute face`,minutes:8,summary:`Everything so far, in the order that works.`,sections:[{heading:`The order`,points:[`Moisturiser and SPF. Wait three minutes.`,`Base where you need it.`,`Concealer under the eyes and on spots.`,`Powder on the T-zone.`,`Blush high on the cheeks.`,`Brows.`,`Mascara.`,`Lip.`]},{heading:`Why this order`,body:`Liquids and creams go on before powders. Base before concealer means you need less concealer. Brows and mascara last, because they frame what you have built.`}],practice:`Time yourself doing the full routine. Repeat until it takes under ten minutes.`,ask:`Write my five-minute everyday routine using the products in my bag.`},{id:`s15`,title:`Taking it all off`,minutes:5,summary:`How you remove makeup matters as much as how you apply it.`,sections:[{heading:`Double cleanse`,body:`First, a cleansing balm, oil or micellar water to dissolve makeup and SPF. Second, your usual cleanser to clean the skin.`},{heading:`Eyes`,body:`Hold a soaked pad on closed eyes for ten seconds before wiping, so mascara melts instead of being rubbed.`},{heading:`Then`,body:`Finish with your evening skincare. Sleeping in makeup clogs pores and dries skin.`}],practice:`Double cleanse tonight and notice how your skin feels.`,ask:`Which makeup remover suits my skin?`}]},{id:`polish`,title:`Polish your everyday look`,level:`Know the basics`,blurb:`Cleaner technique and longer wear for the look you already do.`,lessons:[{id:`p1`,title:`Skin-like base`,minutes:6,summary:`Less product, placed precisely.`,sections:[{heading:`Spot-application`,body:`Apply base only where you see redness or unevenness, usually around the nose, chin and inner cheeks. Leave the rest of the skin bare or with a sheer tint.`},{heading:`Mixing`,body:`Mix a drop of foundation with moisturiser for a sheer, glowing layer on days you want very little coverage.`}],practice:`Apply base only to the centre of the face today.`,ask:`How can I make my base look more like skin?`},{id:`p2`,title:`Colour correcting`,minutes:6,summary:`Opposite colours cancel each other.`,sections:[{heading:`The rules`,points:[`Peach or orange cancels blue and purple dark circles.`,`Green cancels redness.`,`Use a thin layer under concealer, never instead of it.`]}],practice:`Try a thin peach corrector under your concealer.`,ask:`Do I need a colour corrector, and which colour?`},{id:`p3`,title:`Layering cream and powder`,minutes:6,summary:`Cream first, powder second, for colour that lasts.`,sections:[{heading:`Sandwich`,body:`Apply cream blush, set lightly with powder, then add a touch of powder blush on top. It lasts all day and still looks fresh.`}],practice:`Layer a cream blush with a powder blush on top.`,ask:`How do I make my blush last all day?`},{id:`p4`,title:`Sculpting with bronzer`,minutes:7,summary:`Soft warmth, not stripes.`,sections:[{heading:`Placement`,body:`Use a fluffy brush and sweep bronzer in a 3 shape: temple, under the cheekbone, along the jaw. Blend until you cannot see where it starts.`},{heading:`Contour vs bronzer`,body:`Contour is cool-toned and makes shadows. Bronzer is warm and adds a sunlit glow. Most everyday looks only need bronzer.`}],practice:`Bronze in a 3 shape on one side and compare.`,ask:`Which bronzer shade suits my skin?`},{id:`p5`,title:`Three-shade eyes`,minutes:8,summary:`Light, medium, deep: the classic blended eye.`,sections:[{heading:`Steps`,points:[`Light shade all over the lid.`,`Medium shade in the crease, blended with windscreen-wiper motions.`,`Deep shade on the outer third, blended into the medium.`,`A touch of the medium along the lower lashes.`]}],practice:`Do a three-shade eye with neutral browns.`,ask:`Plan a three-shade eye look for my eye colour.`},{id:`p6`,title:`Defining lashes`,minutes:6,summary:`Lashes that look like yours, only more.`,sections:[{heading:`Technique`,body:`Comb through after the first coat. Use the tip of the wand on corner lashes and lower lashes. Brown mascara looks softer on fair lashes.`}],practice:`Use the tip of the wand on your outer corner lashes.`,ask:`How can I make my lashes look fuller?`},{id:`p7`,title:`Long-wear and touch-ups`,minutes:6,summary:`Make it last, then refresh without starting over.`,sections:[{heading:`Lasting`,body:`Thin layers, a gripping primer where makeup fades, powder on the T-zone and setting spray at the end.`},{heading:`Touch-ups`,body:`Blot shine first with a tissue, then press a little powder. Add lip colour and a tap of blush.`}],practice:`Pack a three-item touch-up kit.`,ask:`What should be in my touch-up kit?`},{id:`p8`,title:`Day to night`,minutes:6,summary:`Three small changes turn a day look into an evening one.`,sections:[{heading:`Changes`,points:[`Deepen the outer corner of the eye with a darker shade.`,`Add liner or smudge pencil along the upper lashes.`,`Switch to a deeper or bolder lip.`]}],practice:`Turn your day look into an evening look in under five minutes.`,ask:`Turn my everyday look into an evening look.`}]},{id:`pro`,title:`New techniques`,level:`Confident`,blurb:`Placement, smoky eyes, liner, lips and looks that last.`,lessons:[{id:`x1`,title:`Placement for your face`,minutes:8,summary:`Use your features, not a template.`,sections:[{heading:`Read the face`,body:`Notice where light falls naturally and where shadows sit. Blush and bronzer placement should follow your bone structure: higher and angled for round faces, more horizontal for long faces.`}],practice:`Photograph your face in daylight and mark where light and shadow fall.`,ask:`Where should I place blush and bronzer for my face shape?`},{id:`x2`,title:`Texture and glow control`,minutes:7,summary:`Glow where you want it, matte where you do not.`,sections:[{heading:`Zones`,body:`Keep the high points luminous and the T-zone soft-matte. Avoid shimmer on textured areas; use satin finishes instead.`}],practice:`Apply glow only to the high points of your face.`,ask:`How do I balance glow and texture on my skin?`},{id:`x3`,title:`The soft smoky eye`,minutes:9,summary:`Smoke without the mess.`,sections:[{heading:`Steps`,points:[`Smudge a dark pencil along the upper lash line.`,`Blend it upwards with a small brush.`,`Press a matching shadow over it to set.`,`Blend the edge with a transition shade.`,`Clean up underneath with a little concealer.`]}],practice:`Do a brown smoky eye before trying black.`,ask:`Plan a smoky eye for my eye colour.`},{id:`x4`,title:`Winged liner`,minutes:9,summary:`A wing that suits your eye shape.`,sections:[{heading:`Method`,body:`Follow the angle of your lower lash line towards the end of the brow. Draw the wing first, then connect it to the lash line. For hooded eyes, draw the wing with your eyes open.`}],practice:`Practise the wing on one eye a day until both match.`,ask:`How do I do winged liner for my eye shape?`},{id:`x5`,title:`Lip shaping`,minutes:7,summary:`Subtle overlining and ombré lips.`,sections:[{heading:`Technique`,body:`Overline only at the centre of the top and bottom lip, by no more than a millimetre. For ombré, use a deeper liner around the edge and a lighter shade in the centre.`}],practice:`Try an ombré lip with two shades you own.`,ask:`How can I make my lips look fuller with makeup?`},{id:`x6`,title:`Camera-ready makeup`,minutes:7,summary:`What works in daylight can look different on camera.`,sections:[{heading:`For photos`,points:[`Avoid powders with a lot of white or silica if you use flash; they can cast white.`,`Add a little more definition: cameras flatten features.`,`Check in a photo, not only in the mirror.`]}],practice:`Take a photo in daylight and with flash and compare.`,ask:`How do I make my makeup look good in photos?`},{id:`x7`,title:`Event-proof makeup`,minutes:8,summary:`Makeup that lasts through a long day or night.`,sections:[{heading:`Layering`,body:`Gripping primer, thin layers of long-wear base, cream then powder products, setting spray between steps and at the end.`}],practice:`Do a long-wear routine and check it after eight hours.`,ask:`How do I make my makeup last all day for an event?`},{id:`x8`,title:`Your signature look`,minutes:8,summary:`The look people recognise as you.`,sections:[{heading:`Build it`,body:`Pick one feature to lead: skin, eyes or lips. Keep the rest quiet. Write down the products, shades and order so you can repeat it.`}],practice:`Write your signature look step by step.`,ask:`Help me design a signature look with products and shades.`}]}],Xl=e=>Yl.find(t=>t.id===e)??Yl[0];function Zl(e){return e===`Comfortable`?`polish`:e===`Confident`||e===`Professional`?`pro`:`starter`}function Ql(e,t){return e.lessons.find(e=>!t[e.id])}var $l={skin:{name:`Skin glow-up`,line:`Calmer, more even skin through small daily habits.`},makeup:{name:`Makeup glow-up`,line:`Cleaner technique and a look that is unmistakably yours.`}},eu=[{min:0,name:`Fresh Start`},{min:3,name:`Glow Seeker`},{min:7,name:`Ritual Keeper`},{min:14,name:`Radiance Rising`},{min:21,name:`Glow Icon`},{min:30,name:`Adorn Muse`}],tu=[[`Know your cleanser`,`Feel your skin 10 minutes after washing: tight means too strong.`,`Which cleanser texture suits my skin, and which product would you pick for me?`],[`SPF, the right amount`,`Two finger-lengths for face and neck, every morning.`,`Which sunscreen would you recommend for me and how do I wear it under makeup?`],[`Damp-skin moisturising`,`Apply moisturiser within a minute of patting dry.`,`What moisturiser fits my skin type and budget?`],[`Pillowcase reset`,`Swap to a fresh pillowcase; aim for twice a week.`,`Any small habits that make the biggest difference for clearer skin?`],[`Hands off`,`Notice how often you touch your face today.`,`How do I handle a spot without making it worse?`],[`Neck and chest`,`Take your routine down to the neck and chest.`,`Should I use different products on my neck?`],[`Week one check-in`,`Note one change you have felt this week.`,`Here is how my skin feels after a week. What should I adjust?`],[`Layering order`,`Thinnest to thickest: toner, serum, moisturiser, SPF.`,`Check my layering order with the products in my bag.`],[`Gentle exfoliation`,`One evening only, never on irritated skin.`,`Do I need an exfoliant, and which one would you choose for me?`],[`Hydration, inside and out`,`A glass of water with each ritual today.`,`How do I tell dehydrated skin from dry skin?`],[`Under-eye care`,`Tap, do not rub, any eye cream with your ring finger.`,`What helps tired-looking under-eyes?`],[`Lip care`,`Balm at night, SPF lip balm in the day.`,`Which lip balm would you recommend for me?`],[`Massage minute`,`Sixty seconds of upward strokes while moisturising.`,`Show me a one-minute face massage.`],[`Two-week check-in`,`Look at your skin in daylight; what has calmed?`,`Two weeks in. What is the next step for my skin?`],[`Serum spotlight`,`Learn what your serum actually does.`,`Is niacinamide, vitamin C or hyaluronic acid better for me?`],[`Patch-test habit`,`Test anything new behind the ear for two nights.`,`How do I introduce a new product safely?`],[`Night reset`,`Cleanse twice if you wore SPF or makeup.`,`Do I need a double cleanse with my routine?`],[`Sleep for skin`,`Screens off 20 minutes before your night ritual.`,`What evening habits help my skin most?`],[`Seasonal tweak`,`Adjust textures to today’s weather.`,`How should my routine change with the season where I live?`],[`Body glow`,`Moisturise elbows, knees and hands after showering.`,`Which body products would you recommend for me?`],[`Three-week check-in`,`Choose the one step you would never skip now.`,`Three weeks in. How can I make my routine even simpler?`],[`Retinoid readiness`,`Learn if and when a retinoid belongs in your routine.`,`Should I start a retinoid, and how?`],[`Texture talk`,`Touch your skin: smoother, softer, calmer?`,`What helps rough texture for my skin type?`],[`Shine control`,`Blot, do not powder over and over.`,`How do I manage shine during the day?`],[`Barrier kindness`,`Skip actives tonight; keep it simple.`,`What are signs my skin barrier needs a break?`],[`Travel kit`,`Pick the four products you would pack.`,`Help me build a minimal travel skincare kit.`],[`Makeup-friendly skin`,`Let skincare settle five minutes before makeup.`,`How do I prep skin so makeup lasts?`],[`Final week check-in`,`Photograph your skin in the same light as day one.`,`Almost done. What should my routine look like from here?`],[`Your signature ritual`,`Write down the routine that works for you.`,`Write my personal morning and night routine from my bag.`],[`Glow day`,`Thirty days. Enjoy the skin you have cared for.`,`I finished my 30-day skin glow-up. What next?`]],nu=[[`Skin prep first`,`Moisturise, wait three minutes, then prime only where needed.`,`How should I prep my skin before makeup?`],[`Find your base shade`,`Swatch three shades along the jaw in daylight.`,`
