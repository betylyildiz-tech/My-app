name: GitHub Pages'e yayınla

# main'e her gönderimde site dosyalarını gh-pages dalına kopyalar.
# Pages'i "Deploy from a branch → gh-pages" olarak sunar; Pages API izni gerekmez.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
          touch _site/.nojekyll
      - name: gh-pages dalına gönder
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayın: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
