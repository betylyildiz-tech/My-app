<title>Adorn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F4EEE9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
/* Adorn — sıvı cam arayüz
   Düzen: tek sütun, sabit üst bar + alt dock; içerik arada kayar. Cam efekti (blur) yalnızca sabit katmanlarda. */
:root {
  /* Renk: sıcak espresso + gül bronzu (makyaj modu, açık) */
  --bg: #F4EEE9;
  --bg2: #EADFD7;
  --ink: #2B1F1A;
  --ink2: #6B5A50;
  --ink3: #A08F86;
  --accent: #B5775F;
  --accent2: #8A5643;
  --accent-ink: #FFFFFF;
  --gold: #E3B27A;
  --glass: rgba(255, 251, 248, 0.55);
  --glass-hi: rgba(255, 252, 250, 0.78);
  --glass-line: rgba(255, 255, 255, 0.72);
  --glass-edge: rgba(110, 72, 56, 0.10);
  --shade: 0 14px 34px -16px rgba(74, 40, 28, 0.32);
  --blob1: #F0C3AE;
  --blob2: #E2A99C;
  --blob3: #D8C2B0;
  --blob4: #F6DCCB;
  --ok: #4F8A63;
  --warn: #B9792E;
  --bad: #B0504A;
  --night1: #2A1612;
  --night2: #4A2419;
  /* Tipografi */
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --display: "Sora", "Manrope", -apple-system, "SF Pro Display", system-ui, sans-serif;
  /* Biçim */
  --r-xl: 30px; --r-lg: 24px; --r-md: 18px; --r-pill: 999px;
  --ease: cubic-bezier(.22, .9, .24, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --dock-h: 74px;
  --kb: 0px;
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --bg: #120D0B; --bg2: #1C1411; --ink: #F4EAE3; --ink2: #C3AFA4; --ink3: #85736A;
  --accent: #D6957B; --accent2: #E8B39C; --accent-ink: #1C110D; --gold: #EBBD86;
  --glass: rgba(42, 30, 26, 0.50); --glass-hi: rgba(48, 35, 30, 0.80);
  --glass-line: rgba(255, 235, 222, 0.10); --glass-edge: rgba(0, 0, 0, 0.35);
  --shade: 0 16px 36px -18px rgba(0, 0, 0, 0.7);
  --blob1: #5C2F22; --blob2: #6A3634; --blob3: #3A2820; --blob4: #4B2B21;
  color-scheme: dark;
}
/* Bakım modu: daha sade, serin taş tonları */
:root[data-mode="care"] {
  --bg: #EEF0EE; --bg2: #E1E4E1; --ink: #1C2220; --ink2: #56605B; --ink3: #939C97;
  --accent: #56685F; --accent2: #3F4F47; --accent-ink: #FFFFFF; --gold: #C9A26B;
  --glass: rgba(252, 253, 252, 0.58); --glass-hi: rgba(253, 254, 253, 0.82);
  --glass-line: rgba(255, 255, 255, 0.75); --glass-edge: rgba(40, 60, 50, 0.10);
  --shade: 0 14px 30px -18px rgba(25, 40, 33, 0.30);
  --blob1: #CED8D2; --blob2: #C3CCC6; --blob3: #DEDCD4; --blob4: #D7DED9;
  --night1: #0E1513; --night2: #22302A;
}
:root[data-mode="care"][data-scheme="dark"] {
  --bg: #0E1110; --bg2: #161B19; --ink: #E7ECE9; --ink2: #A9B4AE; --ink3: #6F7A74;
  --accent: #98AEA3; --accent2: #B9CCC2; --accent-ink: #0E1311; --gold: #D4B07A;
  --glass: rgba(30, 37, 34, 0.55); --glass-hi: rgba(34, 42, 38, 0.82);
  --glass-line: rgba(220, 240, 230, 0.09); --glass-edge: rgba(0, 0, 0, 0.4);
  --shade: 0 16px 36px -18px rgba(0, 0, 0, 0.75);
  --blob1: #1F2C27; --blob2: #1B2622; --blob3: #262A26; --blob4: #1A2420;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font); letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  transition: background-color .5s var(--ease), color .3s;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea { -webkit-user-select: text; user-select: text; }
button, .dock, .topbar { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.12; font-weight: 600; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink2); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.pad { padding: 24px 0; }
.ok { color: var(--ok); font-weight: 600; }
.ic { width: 22px; height: 22px; flex: none; }

/* ---------- Sıvı arka plan ---------- */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#bg i {
  position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%;
  will-change: transform; opacity: .9;
  transition: background .8s var(--ease);
}
#bg .b1 { background: radial-gradient(circle at center, var(--blob1) 0%, transparent 62%); top: -38vmax; left: -30vmax; animation: drift1 26s ease-in-out infinite alternate; }
#bg .b2 { background: radial-gradient(circle at center, var(--blob2) 0%, transparent 60%); bottom: -42vmax; right: -36vmax; animation: drift2 32s ease-in-out infinite alternate; }
#bg .b3 { background: radial-gradient(circle at center, var(--blob3) 0%, transparent 60%); top: 20vh; right: -50vmax; animation: drift3 38s ease-in-out infinite alternate; }
#bg .b4 { background: radial-gradient(circle at center, var(--blob4) 0%, transparent 58%); bottom: -20vmax; left: -45vmax; animation: drift1 44s ease-in-out infinite alternate-reverse; }
#bg .grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
:root[data-mode="care"] #bg .b3, :root[data-mode="care"] #bg .b4 { display: none; }
:root[data-mode="care"] #bg i { opacity: .75; }
@keyframes drift1 { to { transform: translate3d(18vmax, 14vmax, 0) scale(1.12); } }
@keyframes drift2 { to { transform: translate3d(-16vmax, -18vmax, 0) scale(1.08); } }
@keyframes drift3 { to { transform: translate3d(-22vmax, 10vmax, 0) scale(.92); } }

/* ---------- Cam ---------- */
.glass {
  background: linear-gradient(160deg, var(--glass-hi), var(--glass));
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-line), 0 0 0 .5px var(--glass-edge), var(--shade);
  border-radius: var(--r-lg);
}
.bar-glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(170%);
  backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-line), 0 0 0 .5px var(--glass-edge), var(--shade);
}
.glass-dark { background: rgba(20, 14, 12, .38); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #fff; border: 1px solid rgba(255,255,255,.18); }

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: var(--r-pill);
  font-weight: 650; font-size: 15.5px; position: relative; overflow: hidden;
  transition: transform .35s var(--spring), opacity .2s, background .3s;
}
.btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%); pointer-events: none; }
.btn:active { transform: scale(.95); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); box-shadow: 0 10px 24px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.ghost { background: var(--glass); border: 1px solid var(--glass-line); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.danger:not(.wide) { background: var(--bad); color: #fff; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.small .ic { width: 18px; height: 18px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .55; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; transition: transform .3s var(--spring), background .2s; color: var(--ink); }
.icon-btn:active { transform: scale(.88); background: var(--glass); }
.text-btn { font-weight: 600; color: var(--ink2); padding: 10px 6px; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent2); font-weight: 650; margin-top: 10px; }
.link-btn .ic { width: 16px; height: 16px; }
:root[data-scheme="dark"] .link-btn { color: var(--accent); }

/* Seçim hapları: dokununca seçilen büyür, diğerleri solar */
.choice { transition: transform .45s var(--spring), opacity .35s var(--ease), box-shadow .35s, background .35s, filter .35s; }
.choice:active { transform: scale(.97); }
.decided .choice { pointer-events: none; }
.decided .choice:not(.picked) { opacity: .32; transform: scale(.96); filter: saturate(.6); }
.decided .choice.picked { transform: scale(1.05); background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border-color: transparent; box-shadow: 0 16px 34px -12px var(--accent); }
.choice.pill {
  width: 100%; min-height: 58px; padding: 14px 22px; border-radius: var(--r-pill);
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-line), 0 0 0 .5px var(--glass-edge), var(--shade);
  font-weight: 600; font-size: 16.5px; text-align: center;
}
.choice.pill.was { border-color: var(--accent); }
.choice.right { background: color-mix(in srgb, var(--ok) 22%, var(--glass-hi)) !important; color: var(--ink) !important; opacity: 1 !important; transform: scale(1.03) !important; border-color: var(--ok) !important; }
.choice.wrong { background: color-mix(in srgb, var(--bad) 18%, var(--glass-hi)) !important; color: var(--ink) !important; animation: shake .4s; }
@keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }

/* ---------- Sahne (karşılama akışı) ---------- */
#app { position: relative; z-index: 1; height: 100%; }
.stage { display: flex; flex-direction: column; padding: calc(var(--top) + 16px) max(20px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 20px) max(20px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.gate { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; max-width: 520px; margin: 0 auto; width: 100%; position: relative; }
.lang-switch { position: absolute; top: 0; right: 0; display: flex; padding: 3px; border-radius: var(--r-pill); background: var(--glass); border: 1px solid var(--glass-line); }
.lang-switch button { padding: 6px 12px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700; color: var(--ink2); transition: background .3s, color .3s; }
.lang-switch button.on { background: var(--ink); color: var(--bg); }
.gate-top { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 9vh; text-align: center; }
.wordmark { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.04em; }
.wordmark.big { font-size: 46px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink2); font-weight: 700; }
.gate-q { display: flex; flex-direction: column; gap: 12px; }
.gate-q h1 { font-size: 32px; }
.choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pill-xl {
  min-height: 112px; border-radius: 34px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; text-align: left;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-line), 0 0 0 .5px var(--glass-edge), var(--shade); position: relative; overflow: hidden;
}
.pill-xl::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; top: -50px; right: -40px; background: radial-gradient(circle, var(--blob2), transparent 70%); opacity: .8; }
.c-main { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
.c-sub { font-size: 13px; opacity: .75; }
.screen-in > * { animation: rise .7s var(--ease) both; }
.screen-in > *:nth-child(2) { animation-delay: .06s; }
.screen-in > *:nth-child(3) { animation-delay: .14s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

/* Orb (asistan) */
.orb { position: relative; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
.orb i { position: absolute; inset: 0; border-radius: 46% 54% 52% 48% / 50% 44% 56% 50%; mix-blend-mode: normal; }
.orb i:nth-child(1) { background: radial-gradient(circle at 30% 30%, #fff8, transparent 40%), linear-gradient(135deg, var(--blob1), var(--accent)); animation: morph 7s ease-in-out infinite; }
.orb i:nth-child(2) { background: linear-gradient(200deg, var(--gold), transparent 60%); opacity: .55; animation: morph 9s ease-in-out infinite reverse; }
.orb i:nth-child(3) { inset: 18%; background: radial-gradient(circle at 35% 30%, #fff, transparent 55%); opacity: .5; filter: blur(2px); animation: morph 6s ease-in-out infinite; }
.orb-lg { width: 120px; height: 120px; box-shadow: 0 30px 60px -20px var(--accent); }
.orb-md { width: 92px; height: 92px; box-shadow: 0 24px 50px -18px var(--accent); }
.orb-sm { width: 56px; height: 56px; }
.orb.talk i:nth-child(1) { animation-duration: 2.6s; }
@keyframes morph {
  0%, 100% { border-radius: 46% 54% 52% 48% / 50% 44% 56% 50%; transform: rotate(0deg) scale(1); }
  33% { border-radius: 58% 42% 40% 60% / 44% 58% 42% 56%; transform: rotate(60deg) scale(1.04); }
  66% { border-radius: 40% 60% 58% 42% / 58% 40% 60% 42%; transform: rotate(-40deg) scale(.97); }
}

/* Sorular */
.quiz { flex: 1; display: flex; flex-direction: column; gap: 26px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-bar { display: flex; align-items: center; justify-content: space-between; }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--glass-edge); background: color-mix(in srgb, var(--ink) 14%, transparent); transition: width .4s var(--ease), background .3s; }
.dots i.on { width: 38px; background: var(--accent); }
.dots i.done { background: var(--accent2); opacity: .55; }
.quiz-q { font-size: 30px; margin-top: 4vh; }
.quiz-opts { display: flex; flex-direction: column; gap: 12px; }
.quiz-opts .choice { animation: rise .55s var(--ease) both; animation-delay: var(--d); }
.slide-in { animation: slideIn .45s var(--ease) both; }
.slide-back { animation: slideBack .45s var(--ease) both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-40px); } }

/* ---------- Kabuk ---------- */
.shell { display: block; }
.topbar {
  position: fixed; z-index: 20; top: calc(var(--top) + 8px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  height: 56px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
}
.topbar .wordmark { position: absolute; left: 50%; transform: translateX(-50%); }
.streak-chip {
  display: flex; align-items: center; gap: 5px; height: 42px; padding: 0 14px 0 10px; border-radius: var(--r-pill); position: relative;
  background: color-mix(in srgb, var(--ink) 6%, transparent); font-weight: 750; font-variant-numeric: tabular-nums; transition: transform .35s var(--spring);
}
.streak-chip:active { transform: scale(.92); }
.streak-chip .flame { color: var(--ink3); display: grid; }
.streak-chip.lit .flame { color: #E8743B; filter: drop-shadow(0 0 6px rgba(232, 116, 59, .55)); animation: flick 1.6s ease-in-out infinite; }
.chip-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); opacity: 0; }
.streak-chip.pending .chip-dot { opacity: 1; animation: pulse 2s infinite; }
@keyframes flick { 50% { transform: scale(1.12) rotate(-4deg); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 10px transparent; } }

.view {
  position: fixed; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: calc(var(--top) + 80px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--bot) + var(--dock-h) + 34px) max(16px, env(safe-area-inset-left, 0px));
  scroll-behavior: auto;
}
.has-composer .view { padding-bottom: calc(var(--bot) + var(--dock-h) + 120px); }
.view > * { max-width: 640px; margin-left: auto; margin-right: auto; }
.view.enter > * { animation: viewIn .38s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(12px) scale(.99); } }

.dock {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(var(--bot) + 10px);
  width: min(460px, calc(100% - 24px)); height: var(--dock-h); border-radius: 30px;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 6px;
  transition: transform .35s var(--ease), opacity .25s;
}
.kb-open .dock { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
.dock-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink3); height: 60px; justify-content: center; border-radius: 22px; transition: color .25s, transform .35s var(--spring); position: relative; }
.dock-btn:active { transform: scale(.88); }
.dock-btn.on { color: var(--ink); }
.dock-btn.on .dock-ic { transform: translateY(-1px); }
.dock-btn.on::after { content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.dock-ic { display: grid; transition: transform .35s var(--spring); }
.dock-l { font-size: 10.5px; font-weight: 700; letter-spacing: .01em; }
.dock-scan { display: grid; place-items: center; }
.dock-scan span {
  width: 58px; height: 58px; border-radius: 22px; display: grid; place-items: center; color: var(--accent-ink);
  background: linear-gradient(140deg, var(--accent), var(--accent2)); box-shadow: 0 12px 26px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.4);
  transform: translateY(-10px); transition: transform .4s var(--spring), border-radius .4s;
}
.dock-scan:active span { transform: translateY(-10px) scale(.88); border-radius: 50%; }
.dock-scan .ic { width: 26px; height: 26px; }

/* ---------- Ana sayfa ---------- */
.home { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
.hello .date { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink2); font-weight: 700; margin-bottom: 6px; }
.hello h1 { font-size: 34px; }
.hello .muted { margin-top: 4px; font-size: 16px; }
.topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.topic {
  min-height: 116px; padding: 16px; border-radius: var(--r-lg); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 14px; text-align: left;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-line), 0 0 0 .5px var(--glass-edge), var(--shade);
  transition: transform .4s var(--spring); animation: rise .6s var(--ease) both; animation-delay: var(--d); position: relative; overflow: hidden;
}
.topic:active { transform: scale(.95); }
.topic-ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent2); }
:root[data-scheme="dark"] .topic-ic { color: var(--accent); }
.topic-t { font-weight: 650; font-size: 15px; line-height: 1.3; }

/* Odak notu */
.focus { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 14px; text-align: center; }
.focus-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px 7px 10px; border-radius: var(--r-pill); background: var(--glass); border: 1px solid var(--glass-line); font-weight: 650; font-size: 14px; }
.focus-pill .ic { width: 18px; height: 18px; color: var(--accent); }
.focus p { font-size: 12.5px; color: var(--ink2); }

/* Mesajlar */
.msgs { display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; animation: msgIn .4s var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.msg.user { justify-content: flex-end; }
.msg.user .bubble {
  max-width: 82%; padding: 11px 16px; border-radius: 22px 22px 6px 22px; color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 22px -14px var(--accent); white-space: pre-wrap; word-wrap: break-word;
}
.msg.ai .ai-body { width: 100%; min-width: 0; }
.ai-text { font-size: 15.5px; line-height: 1.6; }
.ai-text p + p, .ai-text p + ul, .ai-text ul + p, .ai-text ol + p, .ai-text p + ol { margin-top: 8px; }
.ai-text ul, .ai-text ol { margin: 6px 0 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.ai-text li { position: relative; padding-left: 18px; }
.ai-text ul li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ai-text ol { counter-reset: n; }
.ai-text ol li { counter-increment: n; padding-left: 24px; }
.ai-text ol li::before { content: counter(n); position: absolute; left: 0; top: .15em; font-size: 12px; font-weight: 700; color: var(--accent2); }
.ai-text strong { font-weight: 700; }
.ai-extra { display: grid; gap: 12px; margin-top: 12px; }
.ai-extra:empty { display: none; }
.fade-up > * { animation: rise .5s var(--ease) both; }
.fade-up > *:nth-child(2) { animation-delay: .08s; }
.fade-up > *:nth-child(3) { animation-delay: .16s; }
.dots3 { display: inline-flex; gap: 5px; padding: 10px 2px; }
.dots3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bob 1s ease-in-out infinite; }
.dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-5px); opacity: 1; } }

.steps-card { padding: 16px 18px; border-radius: var(--r-lg); background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-line), var(--shade); }
.sc-t { font-weight: 700; margin-bottom: 10px; }
.steps-card ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.steps-card li { counter-increment: s; display: flex; gap: 12px; align-items: center; font-size: 14.5px; }
.steps-card li span { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent2); }
.steps-card li span::before { content: counter(s); }
:root[data-scheme="dark"] .steps-card li span { color: var(--accent); }

.p-row { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.p-row::-webkit-scrollbar { display: none; }
.mini {
  flex: none; width: 232px; scroll-snap-align: start; padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-line), var(--shade);
  transition: transform .35s var(--spring); cursor: pointer;
}
.mini:active { transform: scale(.97); }
.mini-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini-brand { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); font-weight: 700; }
.mini-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
.mini-d { font-size: 13px; color: var(--ink2); line-height: 1.45; flex: 1; }
.mini-bot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.score { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: var(--r-pill); font-variant-numeric: tabular-nums; }
.score.s-hi { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.score.s-mid { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.score.s-lo { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.tag { display: inline-block; font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.add { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); transition: transform .4s var(--spring), background .3s; }
.add .ic { width: 18px; height: 18px; }
.add:active { transform: scale(.85); }
.add.in { background: var(--ok); color: #fff; }
.add.pop { animation: pop .5s var(--spring); }
@keyframes pop { 40% { transform: scale(1.3); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 15px; border-radius: var(--r-pill);
  background: var(--glass); border: 1px solid var(--glass-line); font-size: 14px; font-weight: 600; transition: transform .35s var(--spring), background .25s, color .25s, border-color .25s;
}
.chip:active { transform: scale(.93); }
.chip.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.chip.strong { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border: 0; }
.chip.strong .ic { width: 16px; height: 16px; }
.chip.static { min-height: 30px; font-size: 13px; }
.chip .sw { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }

/* Yazma alanı */
.composer {
  position: fixed; z-index: 19; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--bot) + var(--dock-h) + 18px); width: min(620px, calc(100% - 24px));
  display: flex; align-items: flex-end; gap: 4px; padding: 6px; border-radius: 28px; transition: bottom .25s var(--ease);
}
.kb-open .composer { bottom: calc(var(--kb) + 8px); }
.kb-open .src-note { display: none; }
.composer textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; max-height: 120px;
  font-size: 16px; line-height: 1.4; padding: 11px 4px; color: var(--ink);
}
.composer textarea::placeholder { color: var(--ink3); }
.composer .icon-btn { color: var(--ink2); }
.send { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); transition: transform .35s var(--spring), opacity .2s; }
.send:disabled { opacity: .35; transform: scale(.9); }
.send:not(:disabled):active { transform: scale(.85); }
.src-note { display: none; position: fixed; z-index: 19; left: 0; right: 0; bottom: calc(var(--bot) + var(--dock-h) + 2px); text-align: center; font-size: 11px; color: var(--ink3); pointer-events: none; }
.src-note.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }

/* ---------- Sayfalar ---------- */
.page { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.page-h { display: flex; flex-direction: column; gap: 4px; }
.page-h.row { flex-direction: row; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-t { margin-top: 12px; font-size: 18px; }
.card { padding: 18px; display: flex; flex-direction: column; gap: 16px; }

.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--r-pill); background: var(--glass); border: 1px solid var(--glass-line); }
.seg button { position: relative; z-index: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 650; color: var(--ink2); transition: color .3s; }
.seg button .ic { width: 18px; height: 18px; }
.seg button.on { color: var(--accent-ink); }
.seg-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: var(--r-pill); background: linear-gradient(135deg, var(--accent), var(--accent2)); transform: translateX(calc(var(--i) * 100%)); transition: transform .45s var(--spring); box-shadow: 0 8px 20px -10px var(--accent); }

.r-head { display: flex; align-items: center; gap: 16px; padding: 16px; }
.r-title { font-family: var(--display); font-weight: 600; font-size: 19px; }
.ring { position: relative; width: 64px; height: 64px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .trk { stroke: color-mix(in srgb, var(--ink) 10%, transparent); }
.ring .val { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); transition: stroke-dashoffset .8s var(--ease); }
.ring b { font-size: 15px; font-variant-numeric: tabular-nums; }
.ring.sm { width: 50px; height: 50px; }
.ring.sm b { font-size: 13px; }
.ring.lg { width: 84px; height: 84px; }
.ring.lg b { font-size: 24px; font-family: var(--display); }
.ring.lg small { font-size: 12px; }
.r-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.r-step {
  width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; text-align: left;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-line), var(--shade);
  transition: transform .35s var(--spring), opacity .3s; animation: rise .5s var(--ease) both; animation-delay: var(--d);
}
.r-step:active { transform: scale(.97); }
.tick { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--ink) 22%, transparent); color: transparent; transition: background .35s var(--spring), border-color .3s, color .3s, transform .4s var(--spring); }
.tick .ic { width: 17px; height: 17px; stroke-width: 2.4; }
.r-t { flex: 1; font-weight: 600; transition: opacity .3s; }
.r-m { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.r-step.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; transform: scale(1.08); }
.r-step.done .r-t { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1.5px; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.filters::-webkit-scrollbar { display: none; }
.bag-list { display: grid; gap: 10px; }
.bag-item { display: flex; align-items: center; gap: 14px; padding: 12px 8px 12px 14px; cursor: pointer; animation: rise .5s var(--ease) both; animation-delay: var(--d); transition: transform .3s var(--spring), opacity .25s; }
.bag-item:active { transform: scale(.98); }
.bag-item.gone, .hist-row.gone { opacity: 0; transform: translateX(40px) scale(.96); }
.bag-main { flex: 1; min-width: 0; }
.bag-name { font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stars { display: flex; gap: 2px; margin-top: 4px; }
.stars button { color: color-mix(in srgb, var(--ink) 22%, transparent); padding: 2px; transition: transform .3s var(--spring), color .2s; }
.stars button .ic { width: 18px; height: 18px; }
.stars button.on { color: var(--gold); }
.stars button.on .ic { fill: currentColor; }
.stars button:active { transform: scale(1.3); }
.empty { padding: 30px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
.empty p { color: var(--ink2); max-width: 30ch; }

/* Profil */
.pf-head { display: flex; align-items: center; gap: 14px; }
.avatar { width: 64px; height: 64px; flex: none; }
.avatar b { position: relative; z-index: 2; color: #fff; font-family: var(--display); font-size: 26px; text-shadow: 0 1px 6px rgba(0,0,0,.2); }
.pf-g { display: flex; flex-direction: column; gap: 9px; }
.pf-l { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 750; color: var(--ink2); }
.field {
  width: 100%; border-radius: 18px; padding: 13px 16px; font-size: 16px; border: 1px solid var(--glass-line);
  background: color-mix(in srgb, var(--bg) 55%, transparent); outline: none; transition: border-color .2s, box-shadow .2s; resize: vertical;
}
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.saved-note { font-size: 12.5px; color: var(--ok); font-weight: 650; opacity: 0; transition: opacity .3s; min-height: 18px; }
.saved-note.show { opacity: 1; }
.settings { gap: 0; padding: 6px 18px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent); }
.set-row:last-of-type { border-bottom: 0; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-row > span, .set-sw > span:first-child { font-weight: 650; }
.set-sw { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.settings > p { padding: 10px 0 14px; }
.mini-seg { display: flex; padding: 3px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--ink) 7%, transparent); flex-wrap: wrap; justify-content: flex-end; }
.mini-seg button { padding: 7px 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 650; color: var(--ink2); transition: background .3s, color .3s; }
.mini-seg button.on { background: var(--glass-hi); color: var(--ink); box-shadow: var(--shade); }
.switch { width: 52px; height: 32px; border-radius: 16px; background: color-mix(in srgb, var(--ink) 18%, transparent); position: relative; transition: background .3s; flex: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .4s var(--spring); }
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(20px); }
.status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink2); }
.status.on { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 18px; background: color-mix(in srgb, var(--bad) 8%, transparent); }
.confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ver { margin-top: 6px; }

/* ---------- Katmanlar ---------- */
#layers { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.ov { position: fixed; inset: 0; pointer-events: auto; }
.ov-back { position: absolute; inset: 0; background: rgba(20, 12, 10, .32); opacity: 0; transition: opacity .32s var(--ease); }
.ov.open .ov-back { opacity: 1; }
.ov-sheet .ov-panel {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(640px, 100%); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 32px 32px 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 24px) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .45s var(--ease);
  background: var(--glass-hi);
}
.ov-sheet.open .ov-panel { transform: translateY(0); }
.ov-sheet.closing .ov-panel { transform: translateY(100%); transition-duration: .3s; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 20%, transparent); margin: 4px auto 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.ov-center { display: grid; place-items: center; padding: 20px; }
.ov-center .ov-back { background: rgba(20, 12, 10, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ov-center .ov-panel { position: relative; width: min(420px, 100%); opacity: 0; transform: scale(.9) translateY(20px); transition: transform .55s var(--spring), opacity .3s; }
.ov-center.open .ov-panel { opacity: 1; transform: none; }
.ov-center.closing .ov-panel { opacity: 0; transform: scale(.95); transition-duration: .25s; }
.ov-full .ov-panel { position: absolute; inset: 0; opacity: 0; transform: scale(1.04); transition: transform .45s var(--ease), opacity .3s; }
.ov-full.open .ov-panel { opacity: 1; transform: none; }
.ov-full.closing .ov-panel { opacity: 0; transform: scale(.97); }

.welcome { padding: 30px 24px 22px; border-radius: 34px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-line), 0 30px 60px -20px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); }
.welcome h2 { font-size: 26px; }
.type-on { min-height: 6.5em; color: var(--ink2); font-size: 16px; }
.welcome-actions { display: grid; gap: 8px; width: 100%; }

.hist { display: grid; gap: 6px; }
.hist-row { display: flex; align-items: center; gap: 4px; border-radius: 20px; transition: background .2s, opacity .25s, transform .3s; }
.hist-row.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.hist-main { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; }
.hist-main span:last-child { min-width: 0; display: flex; flex-direction: column; }
.hist-main b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-main small { color: var(--ink3); }
.hist-ic { width: 40px; height: 40px; flex: none; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent2); }
.hist-ic .ic { width: 20px; height: 20px; }

/* Ürün detayı */
.pd { display: flex; flex-direction: column; gap: 14px; }
.pd-top { display: flex; gap: 16px; align-items: center; }
.pd-top h2 { font-size: 21px; margin: 2px 0 6px; }
.pd-fit { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 750; color: var(--ink2); margin-top: -6px; }
.pd-sec { padding: 14px 16px; border-radius: 20px; background: color-mix(in srgb, var(--ink) 4%, transparent); display: grid; gap: 8px; }
.pd-sec h3 { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.pd-sec h3 .ic { width: 18px; height: 18px; color: var(--accent); }
.pd-sec.ok h3 .ic { color: var(--ok); }
.pd-sec.warn h3 .ic { color: var(--warn); }
.pd-sec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink2); }
.pd-sec p { color: var(--ink2); }

/* ---------- Tarama ---------- */
.scan { position: absolute; inset: 0; background: #0B0807; color: #fff; overflow: hidden; }
.scan video, .scan #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan video { opacity: 0; transition: opacity .5s; }
.live .scan video { opacity: 1; }
.scan-shade { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 46%, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
.nocam .scan { background: radial-gradient(circle at 30% 20%, var(--night2), var(--night1)); }
.scan-h { position: absolute; top: calc(var(--top) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.scan-h .icon-btn { color: #fff; }
.frame { position: absolute; left: 50%; top: 44%; width: min(72vw, 320px); aspect-ratio: 3 / 4; max-height: 52vh; transform: translate(-50%, -50%); }
.frame > i { position: absolute; width: 38px; height: 38px; border: 3px solid #fff; opacity: .9; }
.frame > i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.frame > i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.frame > i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.frame > i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
.beam { position: absolute; left: 6%; right: 6%; height: 2px; top: 10%; background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 18px 4px color-mix(in srgb, var(--gold) 60%, transparent); animation: beam 2.4s ease-in-out infinite alternate; }
@keyframes beam { to { top: 90%; } }
.busy .frame { animation: breathe 1.2s ease-in-out infinite; }
.busy .beam { animation-duration: .9s; }
@keyframes breathe { 50% { transform: translate(-50%, -50%) scale(.96); } }
.naming .frame, .frozen:not(.busy) .beam { display: none; }
.scan-hint { position: absolute; left: 24px; right: 24px; top: calc(44% + min(48vw, 213px) + 24px); top: auto; bottom: calc(var(--bot) + 150px); text-align: center; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.naming .scan-hint { display: none; }
.scan-f { position: absolute; left: 0; right: 0; bottom: calc(var(--bot) + 28px); display: flex; align-items: center; justify-content: center; gap: 44px; }
.naming .scan-f, .busy .scan-f { opacity: 0; pointer-events: none; }
.round { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: transform .3s var(--spring); }
.round:active { transform: scale(.88); }
.shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; transition: transform .3s var(--spring); }
.shutter i { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .25s var(--spring); }
.shutter:active i { transform: scale(.82); }
.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flash .3s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.scan-panel {

  /* Türkçe karakterleri sadeleştir, küçük harfe çevir */
  function norm(s) {
    return (' ' + String(s || '').toLocaleLowerCase('tr-TR')
      .replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[ıIİ]/g, 'i')
      .replace(/[öÖ]/g, 'o').replace(/[şŞ]/g, 's').replace(/[üÜ]/g, 'u')
      .replace(/[âà]/g, 'a').replace(/[îì]/g, 'i').replace(/[ûù]/g, 'u')
      .replace(/[’'`´]/g, '').replace(/[^a-z0-9%+\s]/g, ' ').replace(/\s+/g, ' ').trim() + ' ');
  }
  /* Anahtar kelime: kelime başında eşleşir (Türkçe ekleri yakalar). Sonunda boşluk varsa tam kelime. */
  function hit(text, kw) { return text.includes(' ' + kw); }

  function fitScore(p, prof = {}) {
    let s = 72; const why = [], warn = [];

      else { s -= 10; warn.push(L('Cilt tipin için ilk tercih değil', 'Not the first pick for your skin type')); }
    }
    if (p.area === 'hair' && prof.hairType && p.for.includes(prof.hairType)) { s += 6; why.push(L('Saç tipine uygun', 'Suits your hair type')); }
    if (p.area === 'beard' && prof.beard && p.for.includes(prof.beard)) { s += 8; why.push(L('Sakal düzenine uygun', 'Fits your beard routine')); }
    const cs = (prof.concerns || []).filter(c => p.concerns.includes(c));
    if (cs.length) { s += Math.min(2, cs.length) * 7; why.push(L('Odak noktalarını hedefliyor', 'Targets your focus areas')); }
    if (prof.scalp && p.concerns.includes(prof.scalp)) { s += 12; why.push(L('Saç derisi ihtiyacına yönelik', 'Made for your scalp need')); }
    if (st === 'sensitive' && !p.ff) { s -= 12; warn.push(L('Parfüm içerebilir; önce küçük bir alanda dene', 'May contain fragrance; patch test first')); }
    const notes = norm(prof.notes || '');
    if (!p.ff && (hit(notes, 'parfum') || hit(notes, 'fragrance') || hit(notes, 'koku'))) { s -= 10; warn.push(L('Notlarında parfümden kaçındığını yazdın', 'Your notes say you avoid fragrance')); }
    if (prof.budget) {
      const d = p.budget.length - prof.budget.length;
      if (d > 0) { s -= 8 * d; warn.push(L('Bütçenin üzerinde', 'Above your budget')); }
      else { s += 4; why.push(L('Bütçene uygun', 'Within your budget')); }
    }
    if (p.ff) why.push(L('Parfümsüz', 'Fragrance-free'));
    return { score: Math.max(35, Math.min(97, Math.round(s))), why, warn };
  }

  function allowed(p, mode) { return mode === 'makeup' || p.area !== 'makeup'; }

    return PRODUCTS

      .filter(p => !cats || cats.includes(p.cat))
      .filter(p => !areas || areas.includes(p.area))
      .map(p => {
        let sc = fitScore(p, prof).score;
        if (concerns && concerns.some(c => p.concerns.includes(c))) sc += 15;
        return { p, sc };

  function findProduct(q) {
    const n = norm(q);
    let best = null, bestScore = 0;
    for (const p of PRODUCTS) {
      const bc = norm(p.brand).replace(/ /g, '');
      const nw = norm(p.name).trim().split(' ').filter(w => w.length > 2);
      const brandOk = bc.length > 2 && n.replace(/ /g, '').includes(bc);
      const nm = nw.filter(w => n.includes(' ' + w)).length;
      const solo = brandOk && PRODUCTS.filter(x => x.brand === p.brand).length === 1;
      if (!((brandOk && nm >= 1) || nm >= 2 || solo)) continue;
      const sc = (brandOk ? 1 : 0) + nm / nw.length * 1.5 + nm * 0.2;
      if (sc > bestScore) { bestScore = sc; best = p; }
    }
    return best;
  }

  function guessCat(q) {
    const n = norm(q);
    for (const [cat, keys] of CAT_KEYS) if (keys.some(k => hit(n, k))) return cat;
    return 'other';
  }

  function analyzeProduct(query, prof, mode) {
    const known = typeof query === 'object' ? query : findProduct(query);
    if (known) {
      const f = fitScore(known, prof);
      const warn = [...f.warn];
      known.ing.forEach(i => { const k = ING_KEYS.find(x => norm(i).includes(' ' + x[0])); if (k && k[2]) warn.push(k[2]); });
      return { known: true, product: known, score: f.score, why: f.why, warn, how: known.how, ing: known.ing, desc: known.d };
    }
    const cat = guessCat(query);
    const area = CAT_AREA[cat];
    const n = norm(query);
    const ing = [], warn = [];
    ING_KEYS.forEach(([k, label, w]) => { if (hit(n, k)) { if (!ing.some(x => tx(x) === tx(label))) ing.push(label); if (w) warn.push(w); } });
    const fake = { area, for: prof.skinType ? [prof.skinType] : [], concerns: [], budget: prof.budget || '$$', ff: !ing.some(i => tx(i) === tx(L('Parfüm', 'Fragrance'))) };
    const f = fitScore(fake, {});
    if (mode === 'care' && area === 'makeup') warn.push(L('Bu bir makyaj ürünü gibi görünüyor; makyaj içeriği kapalı.', 'This looks like a makeup product; makeup content is off.'));
    if (prof.skinType === 'sensitive') warn.push(L('Hassas cildin var; ilk kullanımda kulak arkasında test et.', 'You have sensitive skin; patch test behind the ear first.'));
    const name = String(query).trim().replace(/\s+/g, ' ').slice(0, 80);
    return {
      known: false,
      product: { id: 'u-' + norm(name).trim().replace(/\s/g, '-').slice(0, 40), brand: '', name, cat, area, for: [], concerns: [], budget: '', ff: fake.ff, ing: ing.map(tx) },
      score: Math.min(80, f.score), why: [L('Kategoriye göre genel değerlendirme', 'General review by category')], warn,
      how: CAT_HOW[cat], ing: ing.map(tx), desc: null
    };
  }

    { id: 'ingredient', area: 'skin', keys: ['niasinamid', 'niacinamide', 'retinol', 'retinoid', 'c vitamini', 'vitamin c', 'hyaluronik', 'hyaluronic', 'salisilik', 'salicylic', 'bha ', 'aha ', 'glikolik', 'glycolic', 'seramid', 'ceramide', 'peptit', 'peptide', 'icerik', 'ingredient'],
      r: (c, n) => {
        const parts = [];

        add(['retinol', 'retinoid'], '**Retinol**: hücre yenilenmesini hızlandırır; ince çizgi, sivilce ve dokuya iyi gelir. Akşam, bezelye kadar, haftada 2 geceyle başla. İlk haftalarda hafif pullanma normal. Hamilelikte kullanılmaz; ertesi sabah SPF şart.', '**Retinol** speeds up cell turnover; good for fine lines, breakouts and texture. Evenings, pea-sized, starting 2 nights a week. Mild flaking early on is normal. Not for pregnancy; SPF the next morning is a must.');
        add(['niasinamid', 'niacinamide'], '**Niasinamid** (B3 vitamini): yağ dengesi, gözenek görünümü, kızarıklık ve lekelere yardımcı. Sabah veya akşam, %5–10 yeterli; neredeyse her içerikle uyumlu.', '**Niacinamide** (vitamin B3) helps with oil, the look of pores, redness and spots. Morning or night, 5–10% is plenty; it plays well with almost everything.');
        add(['c vitamini', 'vitamin c'], '**C vitamini**: antioksidan; ışıltı ve leke görünümü için sabah, SPF\'nin altında. Işık ve havadan korunan ambalaj seç; kahverengileşirse etkisi azalır.', '**Vitamin C** is an antioxidant for glow and spots; use it in the morning under SPF. Pick light- and air-tight packaging; if it turns brown, it\'s lost potency.');
        add(['hyaluronik', 'hyaluronic'], '**Hyaluronik asit**: cilde su çeker. Nemli cilde sür ve üzerine nemlendiriciyle kilitle; aksi halde kuru havada ters etki yapabilir.', '**Hyaluronic acid** draws water into skin. Apply to damp skin and seal with moisturizer, or it can backfire in dry air.');
        add(['salisilik', 'salicylic', 'bha '], '**Salisilik asit (BHA)**: yağda çözünür, gözeneğin içine girer; siyah nokta ve sivilce için ideal. Haftada 2–3 akşam yeterli.', '**Salicylic acid (BHA)** is oil-soluble and gets into pores; ideal for blackheads and breakouts. 2–3 evenings a week is enough.');
        add(['aha ', 'glikolik', 'glycolic'], '**AHA (glikolik/laktik)**: yüzeyi pürüzsüzleştirir, ışıltı verir. Güneş hassasiyetini artırır; SPF şart, retinolle aynı gece kullanma.', '**AHAs (glycolic/lactic)** smooth the surface and add glow. They raise sun sensitivity, so SPF is a must; don\'t use with retinol the same night.');
        add(['seramid', 'ceramide'], '**Seramidler**: cilt bariyerinin harcı. Kuru, hassas ve aktif kullanan ciltler için temel.', '**Ceramides** are the mortar of the skin barrier. Essential for dry or sensitive skin and anyone using actives.');
        add(['peptit', 'peptide'], '**Peptitler**: cildin sıkılık sinyallerini destekler; nazik oldukları için retinol kullanamayanlara iyi bir alternatif.', '**Peptides** support the skin\'s firmness signals; gentle enough to be an alternative if you can\'t use retinol.');
        if (!parts.length) parts.push(tx(L('Hangi içeriği merak ediyorsun? Niasinamid, retinol, C vitamini, hyaluronik asit, BHA/AHA ve seramidi anlatabilirim.', 'Which ingredient are you curious about? I can explain niacinamide, retinol, vitamin C, hyaluronic acid, BHA/AHA and ceramides.')));
        const kws = { 'retinol': 'aging', 'niasinamid': 'pores', 'niacinamide': 'pores', 'salisilik': 'acne', 'salicylic': 'acne', 'hyaluronik': 'dryness', 'hyaluronic': 'dryness', 'vitamin c': 'darkspots', 'c vitamini': 'darkspots' };
        const conc = Object.keys(kws).filter(k => hit(n, k)).map(k => kws[k]);
        return { text: parts.join('\n\n'), products: conc.length ? pick(c.prof, c.mode, { cats: ['serum', 'exfoliant', 'moisturizer'], concerns: conc }, 2) : [] };
      } },

      r: (c) => ({ text: tx(L('Kuru dudaklar için: yalama alışkanlığını bırak, gün içinde parfümsüz balm, gece kalın bir kat vazelin veya lanolin. Dışarıda SPF\'li dudak balmı kullan. Haftada bir yumuşak diş fırçasıyla nazikçe ölü deriyi alabilirsin.', 'For dry lips: stop licking them, use a fragrance-free balm during the day and a thick layer of petrolatum or lanolin at night. Outdoors, use an SPF lip balm. Once a week, gently buff with a soft toothbrush.')) }) },

        'x-api-key': key(),

        'anthropic-dangerous-direct-browser-access': 'true'
      },

    });

    const input = messages.map((m, i) => ({ role: m.role, content: i === 0 && m.role === 'user' ? system + '\n\n---\n\n' + m.content : m.content }));

    }

      S.streak.today = { date: d, tasks: [], lesson: s ? S.streak.doneDays % s.lessons.length : 0, quiz: null };
    }
    if (S.routine.date !== d) S.routine = { date: d, am: [], pm: [] };
    if (S.streak.last && S.streak.last !== d && S.streak.last !== yesterday()) S.streak.count = 0;
  }
  const streakCount = () => (S.streak.last === today() || S.streak.last === yesterday()) ? S.streak.count : 0;
  const level = () => Math.floor(S.streak.xp / 100) + 1;
  const BADGES = [{ n: 3, k: 'badge3' }, { n: 7, k: 'badge7' }, { n: 14, k: 'badge14' }, { n: 30, k: 'badge30' }];

  function completeTask(id, fromEl) {
    ensureToday();
    const tk = S.streak.today.tasks;
    if (tk.includes(id)) return false;
    tk.push(id); S.streak.xp += 10;
    if (fromEl) burst(fromEl, '+10 XP');
    let dayDone = false;
    if (tk.length === 3) {
      dayDone = true;
      S.streak.count = S.streak.last === yesterday() ? S.streak.count + 1 : (S.streak.last === today() ? S.streak.count : 1);
      S.streak.last = today();
      S.streak.best = Math.max(S.streak.best, S.streak.count);
      S.streak.doneDays = Math.min(30, S.streak.doneDays + 1);
      S.streak.xp += 20;
      BADGES.forEach(b => { if (S.streak.count >= b.n && !S.streak.badges.includes(b.n)) S.streak.badges.push(b.n); });
    }
    save(); updateChip();
    if (dayDone) setTimeout(celebrate, 450);
    return true;
  }

  /* ---------- Kök ---------- */
  const app = $('#app');
  let tab = 'chat';

  function boot() {
    ensureToday(); applyTheme();

    if (S.mode === 'makeup' && !S.quizDone) return renderQuiz(0);
    // Ana ekran kısayolları (?go=scan / ?go=routine)
    const goTo = new URLSearchParams(location.search).get('go');
    if (goTo === 'routine' || goTo === 'bag' || goTo === 'profile') tab = goTo;
    renderShell();
    if (goTo === 'scan' && S.welcomed) setTimeout(openScan, 300);
  }

  /* ---------- 1. Yol ayrımı ---------- */

  function pickEffect(btn) {

  /* ---------- 2. Makyaj soruları ---------- */
  const QUIZ = [
    { k: 'level', q: 'q1', o: ['q1a', 'q1b', 'q1c', 'q1d'] },
    { k: 'focus', q: 'q2', o: ['q2a', 'q2b', 'q2c', 'q2d'] },
    { k: 'goal', q: 'q3', o: ['q3a', 'q3b', 'q3c', 'q3d'] }
  ];
  function renderQuiz(i, dir = 1) {
    const q = QUIZ[i];

        </div>
      </section>`;
    $('[data-act=back]', app).onclick = () => { if (i === 0) { S.mode = null; save(); renderGate(); } else renderQuiz(i - 1, -1); };
    $('[data-act=skip]', app).onclick = finishQuiz;
    $$('[data-o]', app).forEach(b => b.onclick = () => {
      buzz(); pickEffect(b);
      S.answers[q.k] = b.dataset.o; save();
      setTimeout(() => (i + 1 < QUIZ.length ? renderQuiz(i + 1) : finishQuiz()), 380);

  function finishQuiz() {
    S.quizDone = true;
    // Yanıtları profile yansıt
    if (S.answers.focus === 'q2b' || S.answers.goal === 'q3d') S.profile.concerns = Array.from(new Set([...(S.profile.concerns || []), 'dull']));

  const dockBtn = (id, icon, label) => `<button type="button" class="dock-btn" data-tab="${id}"><span class="dock-ic">${ic(icon)}</span><span class="dock-l">${t(label)}</span></button>`;

  /* ---------- 3. Karşılama ---------- */
  function openWelcome() {
    const name = (S.profile.name || '').trim();

  function typeOn(el, text) {
    if (reduced()) { el.textContent = text; return; }
    let i = 0;
    const step = () => { i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i); if (i < text.length) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ---------- Katmanlar (sheet / tam ekran) ---------- */
  function overlay(html, kind = 'sheet') {
    const ov = document.createElement('div');
    ov.className = `ov ov-${kind}`;
    ov.innerHTML = `<div class="ov-back"></div><div class="ov-panel ${kind === 'sheet' ? 'bar-glass' : ''}" role="dialog" aria-modal="true">${kind === 'sheet' ? '<div class="grab"></div>' : ''}${html}</div>`;
    $('#layers').appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('open'));
    if (kind === 'sheet') {
      $('.ov-back', ov).onclick = () => closeOverlay(ov);
      dragToClose(ov);
    }
    return ov;
  }
  function closeOverlay(ov) {
    if (!ov || ov.dataset.closing) return;
    ov.dataset.closing = '1';
    ov.classList.remove('open'); ov.classList.add('closing');
    ov.dispatchEvent(new Event('close'));
    setTimeout(() => ov.remove(), 320);
  }
  function dragToClose(ov) {
    const panel = $('.ov-panel', ov); let y0 = null, dy = 0;
    panel.addEventListener('touchstart', (e) => { if (panel.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; panel.style.transition = 'none'; }, { passive: true });
    panel.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
    panel.addEventListener('touchend', () => { if (y0 == null) return; panel.style.transition = ''; panel.style.transform = ''; if (dy > 90) closeOverlay(ov); y0 = null; });
  }

  /* ---------- Sohbet ---------- */
  const activeChat = () => S.chats.find(c => c.id === S.activeChat) || null;
  let busy = false;

  function renderChat() {
    const v = $('#view');
    const c = activeChat();
    if (!c || !c.messages.length) {
      const name = (S.profile.name || '').trim();
      v.innerHTML = `
        <section class="home">
          <div class="hello">
            <p class="date">${new Date().toLocaleDateString(S.lang === 'tr' ? 'tr-TR' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
            <h1>${greet()}${name ? ', ' + esc(name) : ''}</h1>
            <p class="muted">${t('homeSub')}</p>
          </div>
          <div class="topic-grid">
            ${topics().map((tp, i) => `<button type="button" class="topic" style="--d:${i * 40}ms" data-topic="${tp.id}"><span class="topic-ic">${ic(tp.icon)}</span><span class="topic-t">${esc(tx(tp.t))}</span></button>`).join('')}
          </div>
        </section>`;
      $$('[data-topic]', v).forEach(b => b.onclick = () => { buzz(); startTopic(b.dataset.topic); });
    } else {
      const tp = c.topic ? topics().find(x => x.id === c.topic) || findTopicAny(c.topic) : null;
      v.innerHTML = `
        ${tp ? `<div class="focus"><span class="focus-pill">${ic(tp.icon)}${esc(tx(tp.t))}</span><p>${t('focusNote')}</p></div>` : ''}
        <div class="msgs" id="msgs"></div>`;
      const box = $('#msgs');
      c.messages.forEach(m => box.appendChild(msgEl(m)));
      requestAnimationFrame(() => { v.scrollTop = v.scrollHeight; });
    }
    renderComposer();
  }
  const findTopicAny = (id) => [...D.TOPICS.makeup, ...D.TOPICS.care].find(x => x.id === id);

  function renderComposer() {
    const slot = $('#composer-slot');
    if (tab !== 'chat') { slot.innerHTML = ''; return; }
    if ($('#composer', slot)) return;
    slot.innerHTML = `
      <form class="composer bar-glass" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" data-act="photo" aria-label="${t('photo')}">${ic('camera')}</button>
        <textarea id="ask" rows="1" placeholder="${t('inputPh')}" enterkeyhint="send" maxlength="1200"></textarea>
        <button type="submit" class="send" aria-label="${t('send')}" disabled>${ic('send')}</button>
      </form>
      <p class="src-note" id="src-note"></p>`;
    const f = $('#composer'), ta = $('#ask'), sb = $('.send', f);
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; sb.disabled = !ta.value.trim() || busy; };
    ta.addEventListener('input', fit);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } });
    f.onsubmit = (e) => { e.preventDefault(); const v = ta.value.trim(); if (!v || busy) return; ta.value = ''; fit(); send(v); };
    $('[data-act=photo]', f).onclick = openScan;
    updateSrcNote();
  }
  function updateSrcNote() {
    const n = $('#src-note'); if (!n) return;
    const s = AI.source();
    n.textContent = !navigator.onLine ? t('offline') : s ? t('sourceAI') : t('sourceLocal');
    n.classList.toggle('live', !!s);
  }
  window.addEventListener('adorn:ai', updateSrcNote);
  window.addEventListener('online', updateSrcNote);
  window.addEventListener('offline', updateSrcNote);

  function newChat(topic) {
    const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), topic: topic || null, title: '', at: Date.now(), messages: [] };
    S.chats.unshift(c); S.chats = S.chats.slice(0, 40); S.activeChat = c.id; save();
    return c;
  }
  function startTopic(id) {
    const tp = topics().find(x => x.id === id);
    const c = newChat(id); c.title = tx(tp.t);
    if (tab !== 'chat') go('chat');
    send(tx(tp.q), c);
  }

  function msgEl(m) {
    const el = document.createElement('div');
    if (m.role === 'user') {
      el.className = 'msg user';
      el.innerHTML = `<div class="bubble">${m.img ? `<img src="${m.img}" alt="">` : ''}${esc(m.text)}</div>`;
      return el;
    }
    el.className = 'msg ai';
    el.innerHTML = `<div class="ai-body"><div class="ai-text">${md(m.text || '')}</div><div class="ai-extra"></div></div>`;
    fillExtras(el, m);
    return el;
  }
  function fillExtras(el, m) {
    const x = $('.ai-extra', el); let h = '';
    if (m.steps) h += `<div class="steps-card"><p class="sc-t">${esc(m.steps.title)}</p><ol>${m.steps.items.map(s => `<li><span></span>${esc(s)}</li>`).join('')}</ol>${m.steps.routine ? `<button type="button" class="link-btn" data-open-routine="${m.steps.routine}">${t('openRoutine')} ${ic('chev')}</button>` : ''}</div>`;
    if (m.products && m.products.length) h += `<div class="p-row">${m.products.map(id => productById(id)).filter(Boolean).map(miniCard).join('')}</div>`;
    if (m.chips && m.chips.length) h += `<div class="chips">${m.chips.map(c => `<button type="button" class="chip" data-say="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    if (m.offTopic) h += `<div class="chips"><button type="button" class="chip strong" data-newq="${esc(m.offTopic)}">${t('askNew')} ${ic('chev')}</button></div>`;
    x.innerHTML = h;
    $$('[data-say]', x).forEach(b => b.onclick = () => { if (!busy) send(b.dataset.say); });
    $$('[data-newq]', x).forEach(b => b.onclick = () => { const q = b.dataset.newq; newChat(null); renderChat(); send(q); });
    $$('[data-open-routine]', x).forEach(b => b.onclick = () => { routineSide = b.dataset.openRoutine; go('routine'); });
    bindMini(x);
  }
  function miniCard(p) {
    const f = E.fitScore(p, S.profile);
    const inBag = S.bag.some(b => b.id === p.id);
    return `<div class="mini" data-pid="${p.id}" role="button" tabindex="0">
      <div class="mini-top"><span class="mini-brand" lang="en">${esc(p.brand)}</span><span class="score s-${f.score >= 80 ? 'hi' : f.score >= 60 ? 'mid' : 'lo'}">${f.score}%</span></div>
      <p class="mini-name">${esc(p.name)}</p>
      <p class="mini-d">${esc(tx(p.d))}</p>
      <div class="mini-bot"><span class="tag">${esc(tx(D.CATS[p.cat] || D.CATS.other))}</span>
      <button type="button" class="add ${inBag ? 'in' : ''}" data-add="${p.id}" aria-label="${t('addToBag')}">${ic(inBag ? 'check' : 'plus')}</button></div>
    </div>`;
  }
  function bindMini(root) {
    $$('[data-pid]', root).forEach(c => c.onclick = (e) => {
      if (e.target.closest('[data-add]')) return;
      openProduct(E.analyzeProduct(productById(c.dataset.pid), S.profile, S.mode));
    });
    $$('[data-add]', root).forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const p = productById(b.dataset.add);
      if (S.bag.some(x => x.id === p.id)) return;
      addToBag(p); b.classList.add('in', 'pop'); b.innerHTML = ic('check');
    });
  }

  async function send(text, chat) {
    if (busy) return;
    let c = chat || activeChat();
    if (!c) c = newChat(null);
    if (!c.title) c.title = text.slice(0, 48);
    c.at = Date.now();
    const um = { role: 'user', text };
    c.messages.push(um); save();
    if (tab !== 'chat') go('chat');
    else if (!$('#msgs')) renderChat();
    else $('#msgs').appendChild(msgEl(um));
    scrollDown(true);
    busy = true; $('.send') && ($('.send').disabled = true);

    const tp = c.topic ? findTopicAny(c.topic) : null;
    const local = E.reply({ text, prof: S.profile, mode: S.mode, lang: S.lang, name: (S.profile.name || '').trim(), bag: S.bag, topicArea: tp ? tp.area : null });
    const am = { role: 'ai', text: '' };
    const el = msgEl(am); el.classList.add('typing');
    el.querySelector('.ai-text').innerHTML = `<span class="dots3" aria-label="${t('thinking')}"><i></i><i></i><i></i></span>`;
    $('#msgs').appendChild(el); scrollDown(true);

    if (local.offTopic) {
      await wait(300);
      am.text = t('offTopic', tp ? tx(tp.t) : '');
      am.offTopic = text;
      await reveal(el, am);
      return finishMsg(c, am);
    }

    const src = AI.source();
    if (src) {
      try {
        const sys = systemPrompt(tp);
        const history = c.messages.filter(m => m.text).slice(-12).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }));
        const tEl = el.querySelector('.ai-text');
        let started = false, pend = null;
        const final = await AI.chat({ system: sys, messages: history, onText: (txt) => {
          if (!started) { started = true; el.classList.remove('typing'); }
          pend = txt;
          if (!draw.q) { draw.q = requestAnimationFrame(() => { draw.q = 0; tEl.innerHTML = md(pend); scrollDown(); }); }
        } });
        am.text = String(final || pend || '').trim();
        if (!am.text) throw { code: 'empty' };
        el.classList.remove('typing'); tEl.innerHTML = md(am.text);
        if (local.products) am.products = local.products.slice(0, 3);
        if (local.steps && local.steps.routine) am.steps = local.steps;
        if (local.chips) am.chips = local.chips;
        am.ai = true;
        fillExtras(el, am); el.querySelector('.ai-extra').classList.add('fade-up');
        return finishMsg(c, am);
      } catch (e) {
        if (e && e.code === 'bad_key') toast(S.lang === 'tr' ? 'API anahtarı geçersiz. Yerleşik yanıt kullanıldı.' : 'Invalid API key. Used a built-in reply.');
        // yerel yanıta düş
      }
    } else {
      await wait(260 + Math.random() * 220);
    }
    Object.assign(am, { text: local.text, steps: local.steps, products: local.products, chips: local.chips });
    if (local.action === 'streak') am.chips = [...(am.chips || [])];
    await reveal(el, am);
    if (local.action === 'streak') setTimeout(openStreak, 500);
    finishMsg(c, am);
  }
  const draw = { q: 0 };
  function finishMsg(c, am) {
    c.messages.push(am); c.at = Date.now(); save();
    busy = false;
    const ta = $('#ask'); if (ta) $('.send').disabled = !ta.value.trim();
    updateSrcNote();
  }
  function reveal(el, m) {
    return new Promise((res) => {
      el.classList.remove('typing');
      const tEl = el.querySelector('.ai-text');
      const full = m.text || '';
      const done = () => { tEl.innerHTML = md(full); fillExtras(el, m); el.querySelector('.ai-extra').classList.add('fade-up'); scrollDown(); res(); };
      if (reduced() || full.length < 2) return done();
      const per = Math.max(3, Math.ceil(full.length / 40));
      let i = 0;
      const step = () => {
        i = Math.min(full.length, i + per);
        tEl.innerHTML = md(full.slice(0, i));
        scrollDown();
        if (i < full.length) requestAnimationFrame(step); else done();
      };
      requestAnimationFrame(step);
    });
  }
  function scrollDown(force) {
    const v = $('#view'); if (!v) return;

  /* ---------- Tarama ---------- */
  let stream = null;
  function stopCam() { if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; } }
  function openScan() {
    buzz();
    const ov = overlay(`
      <div class="scan">
        <video id="cam" playsinline muted autoplay></video>
        <img id="shot" alt="" hidden>
        <div class="scan-shade"></div>
        <header class="scan-h"><button type="button" class="icon-btn glass-dark" data-act="x" aria-label="${t('close')}">${ic('close')}</button><span>${t('scanTitle')}</span><span style="width:44px"></span></header>
        <div class="frame"><i></i><i></i><i></i><i></i><div class="beam"></div></div>
        <p class="scan-hint" id="scan-hint">${t('scanHint')}</p>
        <div class="scan-panel" id="scan-panel" hidden></div>
        <footer class="scan-f">
          <label class="round glass-dark" aria-label="${t('scanGallery')}">${ic('image')}<input type="file" accept="image/*" id="pick" hidden></label>
          <button type="button" class="shutter" data-act="shoot" aria-label="${t('scanCapture')}"><i></i></button>
          <button type="button" class="round glass-dark" data-act="type" aria-label="${t('scanType')}">${ic('type')}</button>
        </footer>
      </div>`, 'full');
    ov.addEventListener('close', stopCam);
    $('[data-act=x]', ov).onclick = () => closeOverlay(ov);
    $('[data-act=type]', ov).onclick = () => askName(ov, null);
    $('#pick', ov).onchange = (e) => { const f = e.target.files[0]; if (f) handleShot(ov, f); };
    $('[data-act=shoot]', ov).onclick = () => {
      const v = $('#cam', ov);
      if (!stream || !v.videoWidth) { $('#pick', ov).click(); return; }
      buzz(15);
      const c = document.createElement('canvas'); const sc = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
      c.width = v.videoWidth * sc; c.height = v.videoHeight * sc; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      ov.classList.add('flash'); setTimeout(() => ov.classList.remove('flash'), 300);
      c.toBlob(b => handleShot(ov, b), 'image/jpeg', 0.85);
    };
    startCam(ov);
  }
  async function startCam(ov) {
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw 0;
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      if (!ov.isConnected) return stopCam();
      const v = $('#cam', ov); v.srcObject = stream; await v.play().catch(() => {});
      ov.classList.add('live');
    } catch (_) {
      ov.classList.add('nocam');
      $('#scan-hint', ov).textContent = t('camOff');
    }
  }
  async function shrink(blob) {
    try {
      const bmp = await createImageBitmap(blob); const sc = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    } catch (_) { return blob; }
  }
  async function handleShot(ov, blob) {
    blob = await shrink(blob);
    stopCam();
    const img = $('#shot', ov); img.src = URL.createObjectURL(blob); img.hidden = false;
    ov.classList.add('frozen', 'busy'); ov.classList.remove('live');
    $('#scan-hint', ov).textContent = t('analyzing');
    if (AI.source()) {
      try {
        const r = await AI.json({ system: visionPrompt(), messages: [{ role: 'user', content: 'Analyze this product photo.' }], image: blob });
        ov.classList.remove('busy');
        if (!r || !r.found || !r.name) { $('#scan-hint', ov).textContent = t('notFoundPhoto'); return askName(ov, blob); }
        const label = ((r.brand || '') + ' ' + r.name).trim();
        const known = E.findProduct(label);
        let a;
        if (known) a = E.analyzeProduct(known, S.profile, S.mode);
        else {
          a = E.analyzeProduct(label, S.profile, S.mode);
          a.product.brand = String(r.brand || '').slice(0, 60); a.product.name = String(r.name).slice(0, 100);
          if (r.category && D.CATS[r.category]) { a.product.cat = r.category; }
          if (Array.isArray(r.keyIngredients)) a.ing = a.product.ing = r.keyIngredients.slice(0, 6).map(String);
        }
        if (typeof r.fit === 'number') a.score = Math.max(20, Math.min(98, Math.round(r.fit)));
        if (r.summary) a.aiNote = String(r.summary).slice(0, 400);
        if (Array.isArray(r.why) && r.why.length) a.why = r.why.slice(0, 4).map(String);
        if (Array.isArray(r.caution) && r.caution.length) a.warn = r.caution.slice(0, 4).map(String);
        if (r.how) a.how = String(r.how).slice(0, 300);
        closeOverlay(ov); setTimeout(() => openProduct(a), 200);
        return;
      } catch (e) { ov.classList.remove('busy'); }
    }
    ov.classList.remove('busy');
    askName(ov, blob);
  }
  function visionPrompt() {
    const lang = S.lang === 'tr' ? 'Turkish' : 'English';
    return `You review personal care products for a user. Identify the product in the photo and judge its fit for this user profile: ${JSON.stringify(S.profile)}. App mode: ${S.mode === 'care' ? 'no makeup (skin, hair, grooming only)' : 'makeup, skin and hair'}.
Reply with JSON only:
{"found": true, "brand": "", "name": "", "category": one of ${JSON.stringify(Object.keys(D.CATS))}, "keyIngredients": ["..."], "fit": 0-100, "summary": "one or two sentences in ${lang}", "why": ["short reasons in ${lang}"], "caution": ["short cautions in ${lang}"], "how": "how to use, one sentence in ${lang}"}
If no personal care product is visible or the name can't be read, reply {"found": false}. Don't comment on any person in the photo.`;
  }
  function askName(ov, blob) {

    panel.innerHTML = `

      <div class="sugg" id="sugg"></div>`;
    const inp = $('#nm', panel), sg = $('#sugg', panel);
    const suggest = () => {

      const hits = q.length < 2 ? pool.slice(0, 0) : pool.filter(p => E.norm(p.brand + ' ' + p.name).includes(q.split(' ')[0])).slice(0, 5);
      sg.innerHTML = hits.map(p => `<button type="button" data-s="${p.id}"><b>${esc(p.brand)}</b> ${esc(p.name)}</button>`).join('');
      $$('[data-s]', sg).forEach(b => b.onclick = () => { closeOverlay(ov); setTimeout(() => openProduct(E.analyzeProduct(productById(b.dataset.s), S.profile, S.mode)), 200); });
    };
    inp.addEventListener('input', suggest);
    $('#nm-form', panel).onsubmit = (e) => {
      e.preventDefault(); const q = inp.value.trim(); if (!q) return inp.focus();
      closeOverlay(ov); setTimeout(() => openProduct(E.analyzeProduct(q, S.profile, S.mode)), 200);
    };
    setTimeout(() => inp.focus(), 250);
  }
