<title>Adorn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F9F8F6">
<style>
/* Adorn — orijinal sade tasarım
   Düzen: üst bar (≡ adorn · seri · geçmiş · yeni), tek sütun içerik, altta yazma alanı. */
:root {
  /* Renk: orijinal palet (kırık beyaz, kahve, bej) */
  --bg: #F9F8F6;
  --surface: #FFFFFF;
  --grouped: #F2F1EE;
  --ink: #1C1A18;
  --ink2: #5C5752;
  --ink3: #9A948E;
  --line: rgba(60, 56, 52, 0.14);
  --line-strong: rgba(60, 56, 52, 0.22);
  --fill: rgba(120, 116, 112, 0.12);
  --tint: #3C2A21;
  --tint-on: #FFFFFF;
  --linen: #EAD8C0;
  --beige: #D1BB9E;
  --sand: #A79277;
  --flame: #C26A35;
  --material: rgba(250, 249, 247, 0.86);
  --shadow: 0 0 0 .5px rgba(0, 0, 0, .04), 0 10px 30px -12px rgba(0, 0, 0, .16);
  --ok: #4F7A5A;
  --warn: #A9762F;
  --bad: #A4483F;
  --overlay: rgba(0, 0, 0, .22);
  /* Tipografi: sistem yazı tipi */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.22, .9, .24, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --kb: 0px;
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --bg: #0F0D0C; --surface: #1D1A18; --grouped: #171513;
  --ink: #F5F2EE; --ink2: #C9C1B9; --ink3: #8F877F;
  --line: rgba(255, 245, 235, .12); --line-strong: rgba(255, 245, 235, .2); --fill: rgba(200, 190, 180, .16);
  --tint: #EAD8C0; --tint-on: #1A120B; --flame: #E08C50;
  --material: rgba(30, 27, 25, .86);
  --shadow: 0 0 0 .5px rgba(255, 255, 255, .05), 0 14px 40px -12px rgba(0, 0, 0, .6);
  --ok: #8DB89A; --warn: #D9A65C; --bad: #E08A80; --overlay: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font); letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button, .topbar { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { letter-spacing: -0.02em; text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 21px; line-height: 1.2; }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--ink2); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.pad { padding: 24px 0; }
.ok { color: var(--ok); font-weight: 600; }
.ic { width: 20px; height: 20px; flex: none; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--ink2); margin: 0 2px 8px; }
.wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.03em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }

/* Arka plan sade: orijinaldeki gibi */
#bg { display: none; }

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 16px;
  transition: transform .3s var(--spring), opacity .2s;
}
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--tint); color: var(--tint-on); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn.danger { color: var(--bad); border: 1px solid var(--line); background: var(--surface); }
.btn.danger:not(.wide) { background: var(--bad); color: #fff; border: 0; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.small .ic { width: 17px; height: 17px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); transition: transform .25s var(--spring), background .2s; }
.icon-btn:active { transform: scale(.9); background: var(--fill); }
.ring-btn { border: 1px solid var(--line); background: var(--surface); }
.ring-btn .ic { width: 18px; height: 18px; }
.text-btn { font-weight: 500; color: var(--ink2); padding: 10px 6px; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 600; margin-top: 12px; font-size: 15px; }
.link-btn .ic { width: 16px; height: 16px; }

/* Seçim hapları: dokununca seçilen hafif büyür, diğerleri solar */
.choice { transition: transform .4s var(--spring), opacity .3s var(--ease), background .3s, color .3s, border-color .3s; }
.choice:active { transform: scale(.98); }
.decided .choice { pointer-events: none; }
.decided .choice:not(.picked) { opacity: .35; transform: scale(.98); }
.decided .choice.picked { transform: scale(1.03); background: var(--tint); color: var(--tint-on); border-color: var(--tint); }
.decided .choice.picked small { color: inherit; opacity: .75; }
.choice.pill {
  width: 100%; min-height: 56px; padding: 14px 22px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.03);
  font-weight: 500; font-size: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.choice.pill b { font-weight: 600; font-size: 17px; }
.choice.pill small { color: var(--ink2); font-size: 13px; }
.choice.pill.was { border-color: var(--line-strong); }
.choice.right { background: color-mix(in srgb, var(--ok) 14%, var(--surface)) !important; color: var(--ink) !important; border-color: var(--ok) !important; opacity: 1 !important; transform: none !important; }
.choice.wrong { background: color-mix(in srgb, var(--bad) 12%, var(--surface)) !important; color: var(--ink) !important; animation: shake .35s; }
@keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }

/* ---------- Karşılama akışı ---------- */
#app { position: relative; z-index: 1; height: 100%; }
.stage { display: flex; flex-direction: column; padding: calc(var(--top) + 14px) max(20px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 24px) max(20px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.gate { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; max-width: 520px; margin: 0 auto; width: 100%; }
.gate-bar { display: flex; justify-content: space-between; align-items: center; }
.lang-switch { display: flex; padding: 3px; border-radius: 999px; background: var(--fill); }
.lang-switch button { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink2); transition: background .25s, color .25s; }
.lang-switch button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); font-weight: 600; }
.gate-q { display: flex; flex-direction: column; gap: 10px; }
.gate-q h1 { font-size: 30px; }
.choice-col { display: grid; gap: 10px; margin-top: 18px; }
.screen-in > * { animation: rise .55s var(--ease) both; }
.screen-in > *:nth-child(2) { animation-delay: .06s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.quiz { flex: 1; display: flex; flex-direction: column; gap: 24px; max-width: 520px; margin: 0 auto; width: 100%; }
.quiz-bar { display: flex; align-items: center; justify-content: space-between; }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--fill); transition: width .35s var(--ease), background .3s; }
.dots i.on { width: 34px; background: var(--tint); }
.dots i.done { background: var(--sand); }
.quiz-q { font-size: 27px; margin-top: 3vh; }
.quiz-opts { display: flex; flex-direction: column; gap: 10px; }
.quiz-opts .choice { animation: rise .45s var(--ease) both; animation-delay: var(--d); }
.slide-in { animation: slideIn .4s var(--ease) both; }
.slide-back { animation: slideBack .4s var(--ease) both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-28px); } }

/* ---------- Kabuk ---------- */
.topbar {
  position: fixed; z-index: 20; top: 0; left: 0; right: 0;
  padding: calc(var(--top) + 6px) max(10px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 4px;
  background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.topbar .wordmark { flex: 1; margin-left: 2px; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.streak-chip {
  display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 13px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; color: var(--ink2); font-variant-numeric: tabular-nums;
  transition: transform .25s var(--spring);
}
.streak-chip:active { transform: scale(.94); }
.streak-chip .flame { display: grid; color: var(--ink3); }
.streak-chip .ic { width: 17px; height: 17px; }
.streak-chip.lit { color: var(--ink); }
.streak-chip.lit .flame { color: var(--flame); }

.view {
  position: fixed; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: calc(var(--top) + 66px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 32px) max(16px, env(safe-area-inset-left, 0px));
}
.has-composer .view { padding-bottom: calc(var(--bot) + 110px); }
.view > * { max-width: 640px; margin-left: auto; margin-right: auto; }
.view.enter > * { animation: viewIn .3s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }

/* Liste satırları (orijinal "Hızlı başlangıç" görünümü) */
.list { display: grid; gap: 8px; }
.row, .menu-row {
  width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px 10px 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; transition: transform .25s var(--spring), background .2s;
}
.row:active, .menu-row:active { transform: scale(.985); background: var(--grouped); }
.row-ic { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink2); }
.row-ic .ic { width: 16px; height: 16px; }
.row-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-t b { font-weight: 500; font-size: 16px; }
.row-t small { color: var(--ink2); font-size: 13.5px; }
.chev { width: 16px; height: 16px; color: var(--ink3); }
.row.on { border-color: var(--tint); }

/* Ana sayfa */
.home { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.hello .date { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 600; margin-bottom: 4px; }
.hello .muted { margin-top: 3px; }
.foot { font-size: 13px; color: var(--ink2); margin: 12px 2px 0; }

/* Odak notu */
.focus { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0 16px; text-align: center; }
.focus-t { font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.focus p:last-child { font-size: 12.5px; color: var(--ink3); }

/* Mesajlar */
.msgs { display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; animation: msgIn .3s var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { max-width: 82%; padding: 9px 15px; border-radius: 20px; background: var(--tint); color: var(--tint-on); white-space: pre-wrap; word-wrap: break-word; font-size: 16.5px; }
.msg.ai .ai-body { width: 100%; min-width: 0; }
.ai-text { font-size: 17px; line-height: 1.55; }
.ai-text p + p, .ai-text p + ul, .ai-text ul + p, .ai-text ol + p, .ai-text p + ol { margin-top: 8px; }
.ai-text ul, .ai-text ol { margin: 6px 0 0; padding-left: 0; list-style: none; display: grid; gap: 5px; }
.ai-text li { position: relative; padding-left: 16px; }
.ai-text ul li::before { content: ""; position: absolute; left: 3px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink3); }
.ai-text ol { counter-reset: n; }
.ai-text ol li { counter-increment: n; padding-left: 22px; }
.ai-text ol li::before { content: counter(n) "."; position: absolute; left: 0; color: var(--ink2); }
.ai-text strong { font-weight: 600; }
.ai-extra { display: grid; gap: 12px; margin-top: 12px; }
.ai-extra:empty { display: none; }
.fade-up > * { animation: rise .4s var(--ease) both; }
.dots3 { display: inline-flex; gap: 5px; padding: 10px 2px; }
.dots3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); animation: bob 1s ease-in-out infinite; }
.dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

.steps-card { padding: 16px 18px; border-radius: 18px; background: var(--grouped); }
.sc-t { font-weight: 600; margin-bottom: 12px; }
.steps-card ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
.steps-card li { counter-increment: s; display: flex; gap: 12px; align-items: center; font-size: 16px; }
.steps-card li span { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); }
.steps-card li span::before { content: counter(s); }

.p-row { display: grid; gap: 0; border-radius: 18px; background: var(--grouped); overflow: hidden; }
.mini { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: background .2s; }
.mini + .mini { border-top: 1px solid var(--line); }
.mini:active { background: var(--fill); }
.mini-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini-brand { font-size: 12.5px; color: var(--ink2); }
.mini-name { font-weight: 600; font-size: 16px; line-height: 1.3; }
.mini-d { font-size: 14.5px; color: var(--ink2); line-height: 1.45; }
.mini-bot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.score { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.add { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink); transition: transform .3s var(--spring), background .2s; }
.add .ic { width: 17px; height: 17px; }
.add:active { transform: scale(.88); }
.add.in { background: var(--tint); color: var(--tint-on); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; transition: transform .25s var(--spring), background .2s, color .2s;
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--tint); color: var(--tint-on); border-color: var(--tint); }
.chip.strong { background: var(--tint); color: var(--tint-on); border-color: var(--tint); }
.chip.strong .ic { width: 15px; height: 15px; }
.chip.static { min-height: 30px; font-size: 13.5px; }
.chip .sw { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }

/* Yazma alanı */
.composer {
  position: fixed; z-index: 19; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--bot) + 30px); width: min(640px, calc(100% - 24px));
  display: flex; align-items: flex-end; gap: 2px; padding: 5px 5px 5px 16px; border-radius: 26px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: bottom .2s var(--ease);
}
.composer::before { content: ""; position: fixed; left: -50vw; right: -50vw; bottom: calc(-1 * (var(--bot) + 30px)); height: calc(var(--bot) + 60px); background: linear-gradient(transparent, var(--bg) 45%); z-index: -1; pointer-events: none; }
.kb-open .composer { bottom: calc(var(--kb) + 8px); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; max-height: 120px; font-size: 17px; line-height: 1.35; padding: 10px 2px; color: var(--ink); }
.composer textarea::placeholder { color: var(--ink3); }
.send { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--tint-on); transition: transform .25s var(--spring), opacity .2s, background .2s; }
.send .ic { width: 18px; height: 18px; }
.send:disabled { background: var(--fill); color: var(--ink2); }
.src-note { position: fixed; z-index: 19; left: 0; right: 0; bottom: calc(var(--bot) + 8px); text-align: center; font-size: 12px; color: var(--ink2); pointer-events: none; }
.kb-open .src-note { display: none; }

/* ---------- Sayfalar ---------- */
.page { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.page-h { display: flex; flex-direction: column; gap: 3px; }
.page-h.row { flex-direction: row; justify-content: space-between; align-items: flex-end; gap: 12px; background: none; border: 0; padding: 0; min-height: 0; }
.sec-t { margin-top: 10px; font-size: 18px; }
.page .card { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--fill); }
.seg button { position: relative; z-index: 1; height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; font-size: 15px; color: var(--ink2); transition: color .25s; }
.seg button .ic { width: 16px; height: 16px; }
.seg button.on { color: var(--ink); }
.seg-ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 9px; background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.1); transform: translateX(calc(var(--i) * 100%)); transition: transform .35s var(--spring); }

.r-head { flex-direction: row !important; align-items: center; gap: 14px !important; }
.r-title { font-weight: 600; font-size: 18px; }
.ring { position: relative; width: 58px; height: 58px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .trk { stroke: var(--fill); }
.ring .val { stroke: var(--tint); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); transition: stroke-dashoffset .6s var(--ease); }
.ring b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ring.sm { width: 46px; height: 46px; }
.ring.sm b { font-size: 13px; }
.ring.lg { width: 76px; height: 76px; }
.ring.lg b { font-size: 21px; }
.ring.lg small { font-size: 11px; }
.r-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.r-step { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; text-align: left; background: var(--surface); border: 1px solid var(--line); transition: transform .25s var(--spring); }
.r-step:active { transform: scale(.985); }
.tick { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); color: transparent; transition: background .3s var(--spring), border-color .3s, color .3s; }
.tick .ic { width: 15px; height: 15px; stroke-width: 2.4; }
.r-t { flex: 1; transition: opacity .3s; }
.r-m { font-size: 13px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.r-step.done .tick { background: var(--tint); border-color: var(--tint); color: var(--tint-on); }
.r-step.done .r-t { opacity: .5; text-decoration: line-through; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.bag-list { display: grid; gap: 8px; }
.bag-item { display: flex !important; flex-direction: row !important; align-items: center; gap: 12px !important; padding: 12px 6px 12px 12px !important; cursor: pointer; transition: transform .25s var(--spring), opacity .25s; }
.bag-item:active { transform: scale(.985); }
.bag-item.gone, .hist-row.gone { opacity: 0; transform: translateX(30px); }
.bag-main { flex: 1; min-width: 0; }

  function norm(s) {
    return (' ' + String(s || '').toLocaleLowerCase('tr-TR')
      .replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[ıIİ]/g, 'i')
      .replace(/[öÖ]/g, 'o').replace(/[şŞ]/g, 's').replace(/[üÜ]/g, 'u')
      .replace(/[âà]/g, 'a').replace(/[îì]/g, 'i').replace(/[ûù]/g, 'u')

  }
  /* Anahtar kelime: kelime başında eşleşir (Türkçe ekleri yakalar). Sonunda boşluk varsa tam kelime. */
  function hit(text, kw) { return text.includes(' ' + kw); }

    if (p.area === 'hair' && prof.hairType && p.for.includes(prof.hairType)) { s += 6; why.push(L('Saç tipine uygun', 'Suits your hair type')); }
    const cs = (prof.concerns || []).filter(c => p.concerns.includes(c));
    if (cs.length) { s += Math.min(2, cs.length) * 7; why.push(L('Odak noktalarını hedefliyor', 'Targets your focus areas')); }
    if (prof.scalp && p.concerns.includes(prof.scalp)) { s += 12; why.push(L('Saç derisi ihtiyacına yönelik', 'Made for your scalp need')); }
    if (st === 'sensitive' && !p.ff) { s -= 12; warn.push(L('Parfüm içerebilir; önce küçük bir alanda dene', 'May contain fragrance; patch test first')); }
    const notes = norm(prof.notes || '');
    if (!p.ff && (hit(notes, 'parfum') || hit(notes, 'fragrance') || hit(notes, 'koku'))) { s -= 10; warn.push(L('Notlarında parfümden kaçındığını yazdın', 'Your notes say you avoid fragrance')); }

      const d = p.budget.length - prof.budget.length;
      if (d > 0) { s -= 8 * d; warn.push(L('Bütçenin üzerinde', 'Above your budget')); }
      else { s += 4; why.push(L('Bütçene uygun', 'Within your budget')); }
    }
    if (p.ff) why.push(L('Parfümsüz', 'Fragrance-free'));
    return { score: Math.max(35, Math.min(97, Math.round(s))), why, warn };
  }

      .filter(p => !areas || areas.includes(p.area))
      .map(p => {

        if (concerns && concerns.some(c => p.concerns.includes(c))) sc += 15;

  function findProduct(q) {
    const n = norm(q);
    let best = null, bestScore = 0;
    for (const p of PRODUCTS) {
      const bc = norm(p.brand).replace(/ /g, '');
      const nw = norm(p.name).trim().split(' ').filter(w => w.length > 2);
      const brandOk = bc.length > 2 && n.replace(/ /g, '').includes(bc);
      const nm = nw.filter(w => n.includes(' ' + w)).length;
      const solo = brandOk && PRODUCTS.filter(x => x.brand === p.brand).length === 1;
      if (!((brandOk && nm >= 1) || nm >= 2 || solo)) continue;
      const sc = (brandOk ? 1 : 0) + nm / nw.length * 1.5 + nm * 0.2;
      if (sc > bestScore) { bestScore = sc; best = p; }
    }
    return best;
  }

  function guessCat(q) {
    const n = norm(q);
    for (const [cat, keys] of CAT_KEYS) if (keys.some(k => hit(n, k))) return cat;
    return 'other';
  }

  function analyzeProduct(query, prof, mode) {
    const known = typeof query === 'object' ? query : findProduct(query);
    if (known) {
      const f = fitScore(known, prof);
      const warn = [...f.warn];
      known.ing.forEach(i => { const k = ING_KEYS.find(x => norm(i).includes(' ' + x[0])); if (k && k[2]) warn.push(k[2]); });
      return { known: true, product: known, score: f.score, why: f.why, warn, how: known.how, ing: known.ing, desc: known.d };
    }
    const cat = guessCat(query);
    const area = CAT_AREA[cat];
    const n = norm(query);
    const ing = [], warn = [];
    ING_KEYS.forEach(([k, label, w]) => { if (hit(n, k)) { if (!ing.some(x => tx(x) === tx(label))) ing.push(label); if (w) warn.push(w); } });
    const fake = { area, for: prof.skinType ? [prof.skinType] : [], concerns: [], budget: prof.budget || '$$', ff: !ing.some(i => tx(i) === tx(L('Parfüm', 'Fragrance'))) };
    const f = fitScore(fake, {});
    if (mode === 'care' && area === 'makeup') warn.push(L('Bu bir makyaj ürünü gibi görünüyor; makyaj içeriği kapalı.', 'This looks like a makeup product; makeup content is off.'));
    if (prof.skinType === 'sensitive') warn.push(L('Hassas cildin var; ilk kullanımda kulak arkasında test et.', 'You have sensitive skin; patch test behind the ear first.'));
    const name = String(query).trim().replace(/\s+/g, ' ').slice(0, 80);
    return {
      known: false,
      product: { id: 'u-' + norm(name).trim().replace(/\s/g, '-').slice(0, 40), brand: '', name, cat, area, for: [], concerns: [], budget: '', ff: fake.ff, ing: ing.map(tx) },
      score: Math.min(80, f.score), why: [L('Kategoriye göre genel değerlendirme', 'General review by category')], warn,
      how: CAT_HOW[cat], ing: ing.map(tx), desc: null
    };
  }

      r: (c, n) => {

        add(['niasinamid', 'niacinamide'], '**Niasinamid** (B3 vitamini): yağ dengesi, gözenek görünümü, kızarıklık ve lekelere yardımcı. Sabah veya akşam, %5–10 yeterli; neredeyse her içerikle uyumlu.', '**Niacinamide** (vitamin B3) helps with oil, the look of pores, redness and spots. Morning or night, 5–10% is plenty; it plays well with almost everything.');
        add(['c vitamini', 'vitamin c'], '**C vitamini**: antioksidan; ışıltı ve leke görünümü için sabah, SPF\'nin altında. Işık ve havadan korunan ambalaj seç; kahverengileşirse etkisi azalır.', '**Vitamin C** is an antioxidant for glow and spots; use it in the morning under SPF. Pick light- and air-tight packaging; if it turns brown, it\'s lost potency.');
        add(['hyaluronik', 'hyaluronic'], '**Hyaluronik asit**: cilde su çeker. Nemli cilde sür ve üzerine nemlendiriciyle kilitle; aksi halde kuru havada ters etki yapabilir.', '**Hyaluronic acid** draws water into skin. Apply to damp skin and seal with moisturizer, or it can backfire in dry air.');
        add(['salisilik', 'salicylic', 'bha '], '**Salisilik asit (BHA)**: yağda çözünür, gözeneğin içine girer; siyah nokta ve sivilce için ideal. Haftada 2–3 akşam yeterli.', '**Salicylic acid (BHA)** is oil-soluble and gets into pores; ideal for blackheads and breakouts. 2–3 evenings a week is enough.');
        add(['aha ', 'glikolik', 'glycolic'], '**AHA (glikolik/laktik)**: yüzeyi pürüzsüzleştirir, ışıltı verir. Güneş hassasiyetini artırır; SPF şart, retinolle aynı gece kullanma.', '**AHAs (glycolic/lactic)** smooth the surface and add glow. They raise sun sensitivity, so SPF is a must; don\'t use with retinol the same night.');
        add(['seramid', 'ceramide'], '**Seramidler**: cilt bariyerinin harcı. Kuru, hassas ve aktif kullanan ciltler için temel.', '**Ceramides** are the mortar of the skin barrier. Essential for dry or sensitive skin and anyone using actives.');
        add(['peptit', 'peptide'], '**Peptitler**: cildin sıkılık sinyallerini destekler; nazik oldukları için retinol kullanamayanlara iyi bir alternatif.', '**Peptides** support the skin\'s firmness signals; gentle enough to be an alternative if you can\'t use retinol.');
        if (!parts.length) parts.push(tx(L('Hangi içeriği merak ediyorsun? Niasinamid, retinol, C vitamini, hyaluronik asit, BHA/AHA ve seramidi anlatabilirim.', 'Which ingredient are you curious about? I can explain niacinamide, retinol, vitamin C, hyaluronic acid, BHA/AHA and ceramides.')));
        const kws = { 'retinol': 'aging', 'niasinamid': 'pores', 'niacinamide': 'pores', 'salisilik': 'acne', 'salicylic': 'acne', 'hyaluronik': 'dryness', 'hyaluronic': 'dryness', 'vitamin c': 'darkspots', 'c vitamini': 'darkspots' };
        const conc = Object.keys(kws).filter(k => hit(n, k)).map(k => kws[k]);
        return { text: parts.join('\n\n'), products: conc.length ? pick(c.prof, c.mode, { cats: ['serum', 'exfoliant', 'moisturizer'], concerns: conc }, 2) : [] };
      } },

      r: (c) => ({ text: tx(L('Kuru dudaklar için: yalama alışkanlığını bırak, gün içinde parfümsüz balm, gece kalın bir kat vazelin veya lanolin. Dışarıda SPF\'li dudak balmı kullan. Haftada bir yumuşak diş fırçasıyla nazikçe ölü deriyi alabilirsin.', 'For dry lips: stop licking them, use a fragrance-free balm during the day and a thick layer of petrolatum or lanolin at night. Outdoors, use an SPF lip balm. Once a week, gently buff with a soft toothbrush.')) }) },

/* Adorn — Claude bağlantısı (isteğe bağlı). Sıra: kullanıcı API anahtarı → barındırıcı "sample" yeteneği → yok (yerel motor). */
(function () {
  const MODEL = 'claude-sonnet-5-5';
  const API = 'https://api.anthropic.com/v1/messages';
  let sample = null; let sampleDenied = false;

  // Claude Artifact önizlemesinde çalışıyorsa yerleşik Claude erişimini kullan
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(s => { sample = s || null; window.dispatchEvent(new Event('adorn:ai')); }, () => {});
    }
  } catch (_) {}

  const key = () => (window.ADORN_KEY || '').trim();

  function source() {
    if (!navigator.onLine) return null;
    if (key()) return 'api';
    if (sample && !sampleDenied) return 'sample';
    return null;
  }

  async function blobToB64(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = '';
    for (let i = 0; i < buf.length; i += 32768) s += String.fromCharCode.apply(null, buf.subarray(i, i + 32768));
    return btoa(s);
  }

  async function apiStream({ system, messages, image, maxTokens = 800, onText, signal, stream = true }) {
    const msgs = messages.map(m => ({ role: m.role, content: m.content }));
    if (image) {
      const last = msgs[msgs.length - 1];
      last.content = [
        { type: 'image', source: { type: 'base64', media_type: image.type || 'image/jpeg', data: await blobToB64(image) } },
        { type: 'text', text: last.content }
      ];
    }
    const res = await fetch(API, {
      method: 'POST', signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': key(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages: msgs, stream })
    });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.error?.message || msg; } catch (_) {}
      throw { code: res.status === 401 ? 'bad_key' : 'http', message: msg };
    }
    if (!stream) { const j = await res.json(); return (j.content || []).map(b => b.text || '').join(''); }
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        try {
          const ev = JSON.parse(line.slice(5));
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText && onText(text); }
          if (ev.type === 'error') throw { code: 'stream', message: ev.error?.message };
        } catch (e) { if (e && e.code) throw e; }
      }
    }
    return text;
  }

  async function sampleCall({ system, messages, image, onText, signal }) {
    const input = messages.map((m, i) => ({ role: m.role, content: i === 0 && m.role === 'user' ? system + '\n\n---\n\n' + m.content : m.content }));
    if (input[0]?.role !== 'user') input.unshift({ role: 'user', content: system });
    const opts = { cache: false, modelTier: 'default', signal, onText: onText ? ({ text }) => onText(text) : undefined };
    if (image) opts.images = [image];
    try {
      const r = await sample(input, opts);
      return r.text;
    } catch (e) {
      if (e && e.code === 'not_granted') sampleDenied = true;
      throw e;
    }
  }

  async function chat(opts) {
    const src = source();
    if (src === 'api') return apiStream(opts);
    if (src === 'sample') return sampleCall(opts);
    throw { code: 'unavailable' };
  }

  async function json(opts) {
    const text = await chat({ ...opts, onText: null, stream: false });
    const m = String(text).match(/\{[\s\S]*\}/);
    if (!m) throw { code: 'parse' };
    return JSON.parse(m[0]);
  }

  window.ADORN_AI = { source, chat, json, MODEL };
})();

  /* ---------- 2. Makyaj soruları ---------- */
  const QUIZ = [
    { k: 'level', q: 'q1', o: ['q1a', 'q1b', 'q1c', 'q1d'] },
    { k: 'focus', q: 'q2', o: ['q2a', 'q2b', 'q2c', 'q2d'] },
    { k: 'goal', q: 'q3', o: ['q3a', 'q3b', 'q3c', 'q3d'] }
  ];
  function renderQuiz(i, dir = 1) {
    const q = QUIZ[i];
    app.className = 'stage';
    app.innerHTML = `
      <section class="quiz ${dir > 0 ? 'slide-in' : 'slide-back'}">
        <div class="quiz-bar">
          <button type="button" class="icon-btn" data-act="back" aria-label="${t('back')}">${ic('back')}</button>
          <div class="dots" aria-label="${t('stepOf', i + 1, QUIZ.length)}">${QUIZ.map((_, j) => `<i class="${j < i ? 'done' : j === i ? 'on' : ''}"></i>`).join('')}</div>

        </div>
      </section>`;
    $('[data-act=back]', app).onclick = () => { if (i === 0) { S.mode = null; save(); renderGate(); } else renderQuiz(i - 1, -1); };
    $('[data-act=skip]', app).onclick = finishQuiz;
    $$('[data-o]', app).forEach(b => b.onclick = () => {
      buzz(); pickEffect(b);

  function finishQuiz() {
    S.quizDone = true;
    // Yanıtları profile yansıt
    if (S.answers.focus === 'q2b' || S.answers.goal === 'q3d') S.profile.concerns = Array.from(new Set([...(S.profile.concerns || []), 'dull']));
    save(); renderShell();
  }

  /* ---------- Kabuk ---------- */
  function renderShell() {
    app.className = 'shell';
    app.innerHTML = `
      <header class="topbar">
        <button type="button" class="icon-btn" id="nav-btn" aria-label="${t('menu')}">${ic('menu')}</button>
        <span class="wordmark" id="title">adorn</span>
        <div class="top-actions">
          <button type="button" class="streak-chip" data-act="streak" aria-label="${t('streakTitle')}"><span class="flame">${ic('flame')}</span><b id="chip-n">${streakCount()}</b></button>

  function openMenu() {

  /* ---------- 3. Karşılama ---------- */
  function openWelcome() {
    const ov = overlay(`
      <div class="welcome">
        <span class="wordmark">adorn</span>
        <h2>${t('welcomeTitle')}</h2>
        <p class="type-on" id="wl-text"></p>
        <div class="welcome-actions">

  function typeOn(el, text) {
    if (reduced()) { el.textContent = text; return; }
    let i = 0;
    const step = () => { i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i); if (i < text.length) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ---------- Katmanlar (sheet / tam ekran) ---------- */
  function overlay(html, kind = 'sheet') {
    const ov = document.createElement('div');
    ov.className = `ov ov-${kind}`;
    ov.innerHTML = `<div class="ov-back"></div><div class="ov-panel ${kind === 'sheet' ? 'bar-glass' : ''}" role="dialog" aria-modal="true">${kind === 'sheet' ? '<div class="grab"></div>' : ''}${html}</div>`;
    $('#layers').appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('open'));
    if (kind === 'sheet') {
      $('.ov-back', ov).onclick = () => closeOverlay(ov);
      dragToClose(ov);
    }
    return ov;
  }
  function closeOverlay(ov) {
    if (!ov || ov.dataset.closing) return;
    ov.dataset.closing = '1';
    ov.classList.remove('open'); ov.classList.add('closing');
    ov.dispatchEvent(new Event('close'));
    setTimeout(() => ov.remove(), 320);
  }
  function dragToClose(ov) {
    const panel = $('.ov-panel', ov); let y0 = null, dy = 0;
    panel.addEventListener('touchstart', (e) => { if (panel.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; panel.style.transition = 'none'; }, { passive: true });
    panel.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
    panel.addEventListener('touchend', () => { if (y0 == null) return; panel.style.transition = ''; panel.style.transform = ''; if (dy > 90) closeOverlay(ov); y0 = null; });
  }

  /* ---------- Sohbet ---------- */
  const activeChat = () => S.chats.find(c => c.id === S.activeChat) || null;
  let busy = false;

  function renderChat() {
    const v = $('#view');
    const c = activeChat();
    if (!c || !c.messages.length) {
      const name = (S.profile.name || '').trim();
      v.innerHTML = `
        <section class="home">
          <div class="hello">
            <p class="date">${new Date().toLocaleDateString(S.lang === 'tr' ? 'tr-TR' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
            <h1>${greet()}${name ? ', ' + esc(name) : ''}</h1>
            <p class="muted">${t('homeSub')}</p>
          </div>
          <div>
            <p class="label">${t('quickStart')}</p>
            <div class="list">
              ${topics().map(tp => `<button type="button" class="row" data-topic="${tp.id}"><span class="row-ic">${ic(tp.icon)}</span><span class="row-t"><b>${esc(tx(tp.t))}</b></span>${ic('chev', 'chev')}</button>`).join('')}
            </div>
            <p class="foot">${t('homeFoot')}</p>
          </div>
        </section>`;
      $$('[data-topic]', v).forEach(b => b.onclick = () => { buzz(); startTopic(b.dataset.topic); });
    } else {
      const tp = c.topic ? topics().find(x => x.id === c.topic) || findTopicAny(c.topic) : null;
      v.innerHTML = `
        ${tp ? `<div class="focus"><p class="focus-t">${esc(tx(tp.t))}</p><p>${t('focusNote')}</p></div>` : ''}
        <div class="msgs" id="msgs"></div>`;
      const box = $('#msgs');
      c.messages.forEach(m => box.appendChild(msgEl(m)));
      requestAnimationFrame(() => { v.scrollTop = v.scrollHeight; });
    }
    renderComposer();
  }
  const findTopicAny = (id) => [...D.TOPICS.makeup, ...D.TOPICS.care].find(x => x.id === id);

  function renderComposer() {
    const slot = $('#composer-slot');
    if (tab !== 'chat') { slot.innerHTML = ''; return; }
    if ($('#composer', slot)) return;
    slot.innerHTML = `
      <form class="composer bar-glass" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" data-act="photo" aria-label="${t('photo')}">${ic('camera')}</button>
        <textarea id="ask" rows="1" placeholder="${t('inputPh')}" enterkeyhint="send" maxlength="1200"></textarea>
        <button type="submit" class="send" aria-label="${t('send')}" disabled>${ic('send')}</button>
      </form>
      <p class="src-note" id="src-note"></p>`;
    const f = $('#composer'), ta = $('#ask'), sb = $('.send', f);
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; sb.disabled = !ta.value.trim() || busy; };
    ta.addEventListener('input', fit);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } });
    f.onsubmit = (e) => { e.preventDefault(); const v = ta.value.trim(); if (!v || busy) return; ta.value = ''; fit(); send(v); };
    $('[data-act=photo]', f).onclick = openScan;
    updateSrcNote();
  }
  function updateSrcNote() {
    const n = $('#src-note'); if (!n) return;
    const s = AI.source();
    n.textContent = !navigator.onLine ? t('offline') : s ? t('sourceAI') : t('sourceLocal');
    n.classList.toggle('live', !!s);
  }
  window.addEventListener('adorn:ai', updateSrcNote);
  window.addEventListener('online', updateSrcNote);
  window.addEventListener('offline', updateSrcNote);

  function newChat(topic) {
    const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), topic: topic || null, title: '', at: Date.now(), messages: [] };
    S.chats.unshift(c); S.chats = S.chats.slice(0, 40); S.activeChat = c.id; save();
    return c;
  }
  function startTopic(id) {
    const tp = topics().find(x => x.id === id);
    const c = newChat(id); c.title = tx(tp.t);
    if (tab !== 'chat') go('chat');
    send(tx(tp.q), c);
  }

  function msgEl(m) {
    const el = document.createElement('div');
    if (m.role === 'user') {
      el.className = 'msg user';
      el.innerHTML = `<div class="bubble">${m.img ? `<img src="${m.img}" alt="">` : ''}${esc(m.text)}</div>`;
      return el;
    }
    el.className = 'msg ai';
    el.innerHTML = `<div class="ai-body"><div class="ai-text">${md(m.text || '')}</div><div class="ai-extra"></div></div>`;
    fillExtras(el, m);
    return el;
  }
  function fillExtras(el, m) {
    const x = $('.ai-extra', el); let h = '';
    if (m.steps) h += `<div class="steps-card"><p class="sc-t">${esc(m.steps.title)}</p><ol>${m.steps.items.map(s => `<li><span></span>${esc(s)}</li>`).join('')}</ol>${m.steps.routine ? `<button type="button" class="link-btn" data-open-routine="${m.steps.routine}">${t('openRoutine')} ${ic('chev')}</button>` : ''}</div>`;
    if (m.products && m.products.length) h += `<div class="p-row">${m.products.map(id => productById(id)).filter(Boolean).map(miniCard).join('')}</div>`;
    if (m.chips && m.chips.length) h += `<div class="chips">${m.chips.map(c => `<button type="button" class="chip" data-say="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    if (m.offTopic) h += `<div class="chips"><button type="button" class="chip strong" data-newq="${esc(m.offTopic)}">${t('askNew')} ${ic('chev')}</button></div>`;
    x.innerHTML = h;
    $$('[data-say]', x).forEach(b => b.onclick = () => { if (!busy) send(b.dataset.say); });
    $$('[data-newq]', x).forEach(b => b.onclick = () => { const q = b.dataset.newq; newChat(null); renderChat(); send(q); });
    $$('[data-open-routine]', x).forEach(b => b.onclick = () => { routineSide = b.dataset.openRoutine; go('routine'); });
    bindMini(x);
  }
  function miniCard(p) {
    const f = E.fitScore(p, S.profile);
    const inBag = S.bag.some(b => b.id === p.id);
    return `<div class="mini" data-pid="${p.id}" role="button" tabindex="0">
      <div class="mini-top"><span class="mini-brand" lang="en">${esc(p.brand)}</span><span class="score s-${f.score >= 80 ? 'hi' : f.score >= 60 ? 'mid' : 'lo'}">${f.score}%</span></div>
      <p class="mini-name">${esc(p.name)}</p>
      <p class="mini-d">${esc(tx(p.d))}</p>
      <div class="mini-bot"><span class="tag">${esc(tx(D.CATS[p.cat] || D.CATS.other))}</span>
      <button type="button" class="add ${inBag ? 'in' : ''}" data-add="${p.id}" aria-label="${t('addToBag')}">${ic(inBag ? 'check' : 'plus')}</button></div>
    </div>`;
  }
  function bindMini(root) {
    $$('[data-pid]', root).forEach(c => c.onclick = (e) => {
      if (e.target.closest('[data-add]')) return;
      openProduct(E.analyzeProduct(productById(c.dataset.pid), S.profile, S.mode));
    });
    $$('[data-add]', root).forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const p = productById(b.dataset.add);
      if (S.bag.some(x => x.id === p.id)) return;
      addToBag(p); b.classList.add('in', 'pop'); b.innerHTML = ic('check');
    });
  }

  async function send(text, chat) {
    if (busy) return;
    let c = chat || activeChat();
    if (!c) c = newChat(null);
    if (!c.title) c.title = text.slice(0, 48);
    c.at = Date.now();
    const um = { role: 'user', text };
    c.messages.push(um); save();
    if (tab !== 'chat') go('chat');
    else if (!$('#msgs')) renderChat();
    else $('#msgs').appendChild(msgEl(um));
    scrollDown(true);
    busy = true; $('.send') && ($('.send').disabled = true);

    const tp = c.topic ? findTopicAny(c.topic) : null;
    const local = E.reply({ text, prof: S.profile, mode: S.mode, lang: S.lang, name: (S.profile.name || '').trim(), bag: S.bag, topicArea: tp ? tp.area : null });
    const am = { role: 'ai', text: '' };
    const el = msgEl(am); el.classList.add('typing');
    el.querySelector('.ai-text').innerHTML = `<span class="dots3" aria-label="${t('thinking')}"><i></i><i></i><i></i></span>`;
    $('#msgs').appendChild(el); scrollDown(true);

    if (local.offTopic) {
      await wait(300);
      am.text = t('offTopic', tp ? tx(tp.t) : '');
      am.offTopic = text;
      await reveal(el, am);
      return finishMsg(c, am);
    }

    const src = AI.source();
    if (src) {
      try {
        const sys = systemPrompt(tp);
        const history = c.messages.filter(m => m.text).slice(-12).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }));
        const tEl = el.querySelector('.ai-text');
        let started = false, pend = null;
        const final = await AI.chat({ system: sys, messages: history, onText: (txt) => {
          if (!started) { started = true; el.classList.remove('typing'); }
          pend = txt;
          if (!draw.q) { draw.q = requestAnimationFrame(() => { draw.q = 0; tEl.innerHTML = md(pend); scrollDown(); }); }
        } });
        am.text = String(final || pend || '').trim();
        if (!am.text) throw { code: 'empty' };
        el.classList.remove('typing'); tEl.innerHTML = md(am.text);
        if (local.products) am.products = local.products.slice(0, 3);
        if (local.steps && local.steps.routine) am.steps = local.steps;
        if (local.chips) am.chips = local.chips;
        am.ai = true;
        fillExtras(el, am); el.querySelector('.ai-extra').classList.add('fade-up');
        return finishMsg(c, am);
      } catch (e) {
        if (e && e.code === 'bad_key') toast(S.lang === 'tr' ? 'API anahtarı geçersiz. Yerleşik yanıt kullanıldı.' : 'Invalid API key. Used a built-in reply.');
        // yerel yanıta düş
      }
    } else {
      await wait(260 + Math.random() * 220);
    }
    Object.assign(am, { text: local.text, steps: local.steps, products: local.products, chips: local.chips });
    if (local.action === 'streak') am.chips = [...(am.chips || [])];
    await reveal(el, am);
    if (local.action === 'streak') setTimeout(openStreak, 500);
    finishMsg(c, am);
  }
  const draw = { q: 0 };
  function finishMsg(c, am) {
    c.messages.push(am); c.at = Date.now(); save();
    busy = false;
    const ta = $('#ask'); if (ta) $('.send').disabled = !ta.value.trim();
    updateSrcNote();
  }
  function reveal(el, m) {
    return new Promise((res) => {
      el.classList.remove('typing');
      const tEl = el.querySelector('.ai-text');
      const full = m.text || '';
      const done = () => { tEl.innerHTML = md(full); fillExtras(el, m); el.querySelector('.ai-extra').classList.add('fade-up'); scrollDown(); res(); };
      if (reduced() || full.length < 2) return done();
      const per = Math.max(3, Math.ceil(full.length / 40));
      let i = 0;
      const step = () => {
        i = Math.min(full.length, i + per);
        tEl.innerHTML = md(full.slice(0, i));
        scrollDown();
        if (i < full.length) requestAnimationFrame(step); else done();
      };
      requestAnimationFrame(step);
    });
  }
  function scrollDown(force) {
    const v = $('#view'); if (!v) return;
    const near = v.scrollHeight - v.scrollTop - v.clientHeight < 160;
    if (force || near) v.scrollTop = v.scrollHeight;
  }
  function systemPrompt(tp) {
    const lang = S.lang === 'tr' ? 'Turkish (natural, fluent, grammatically correct Turkish; use "sen" form)' : 'English';
    const prof = { ...S.profile }; delete prof.notes;
    const scope = S.mode === 'care'
      ? 'Scope: skincare, haircare and scalp care only; the app is unisex. Never suggest makeup. If asked about makeup, say makeup content is turned off and can be enabled in Profile > Settings.'
      : 'Scope: skincare, haircare and makeup.';
    return [
      'You are Adorn, a warm, knowledgeable personal care assistant inside a mobile app.',
      `Always reply in ${lang}, even if the user mixes languages.`,
      'Keep it short and practical: 2–5 sentences, or up to 6 bullet lines starting with "• ". Use **bold** sparingly. No headings, tables or emoji.',
      scope,
      tp ? `This chat is focused on: "${tx(tp.t)}". Keep answers on this topic; if the user drifts far, answer in one line and suggest starting a new chat.` : '',
      `User profile (may be partial): ${JSON.stringify(prof)}.` + (S.profile.notes ? ` User notes: ${S.profile.notes.slice(0, 300)}` : ''),
      S.bag.length ? `Products they own: ${S.bag.map(b => (b.brand ? b.brand + ' ' : '') + b.name).join('; ')}.` : '',
      'Do not diagnose. For persistent, painful or spreading skin/scalp problems, recommend a dermatologist. Never comment on age, gender, ethnicity or attractiveness.'
    ].filter(Boolean).join('\n');
  }

  function openHistory() {
    const list = S.chats.filter(c => c.messages.length);
    const ov = overlay(`
      <div class="sheet-head"><h2>${t('chats')}</h2><button type="button" class="btn small primary" data-act="new">${ic('plus')} ${t('newChat')}</button></div>
      <div class="hist">${list.length ? list.map(c => {

    toast(t('added'), { label: t('undo'), run: () => { S.bag = S.bag.filter(b => b.id !== p.id); save(); if (tab === 'bag') renderBag(); } });

  /* ---------- Tarama ---------- */
  let stream = null;
  function stopCam() { if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; } }
  function openScan() {
    buzz();
    const ov = overlay(`
      <div class="scan">
        <video id="cam" playsinline muted autoplay></video>
        <img id="shot" alt="" hidden>
        <div class="scan-shade"></div>
        <header class="scan-h"><button type="button" class="icon-btn cam-btn" data-act="x" aria-label="${t('close')}">${ic('close')}</button><span>${t('scanTitle')}</span><span style="width:44px"></span></header>
        <div class="frame"><i></i><i></i><i></i><i></i><div class="beam"></div></div>
        <p class="scan-hint" id="scan-hint">${t('scanHint')}</p>
        <div class="scan-panel" id="scan-panel" hidden></div>
        <footer class="scan-f">
          <label class="round cam-btn" aria-label="${t('scanGallery')}">${ic('image')}<input type="file" accept="image/*" id="pick" hidden></label>
          <button type="button" class="shutter" data-act="shoot" aria-label="${t('scanCapture')}"><i></i></button>
          <button type="button" class="round cam-btn" data-act="type" aria-label="${t('scanType')}">${ic('type')}</button>
        </footer>
      </div>`, 'full');
    ov.addEventListener('close', stopCam);
    $('[data-act=x]', ov).onclick = () => closeOverlay(ov);
    $('[data-act=type]', ov).onclick = () => askName(ov, null);
    $('#pick', ov).onchange = (e) => { const f = e.target.files[0]; if (f) handleShot(ov, f); };
    $('[data-act=shoot]', ov).onclick = () => {
      const v = $('#cam', ov);
      if (!stream || !v.videoWidth) { $('#pick', ov).click(); return; }
      buzz(15);
      const c = document.createElement('canvas'); const sc = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
      c.width = v.videoWidth * sc; c.height = v.videoHeight * sc; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      ov.classList.add('flash'); setTimeout(() => ov.classList.remove('flash'), 300);
      c.toBlob(b => handleShot(ov, b), 'image/jpeg', 0.85);
    };
    startCam(ov);
  }
  async function startCam(ov) {
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw 0;
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      if (!ov.isConnected) return stopCam();
      const v = $('#cam', ov); v.srcObject = stream; await v.play().catch(() => {});
      ov.classList.add('live');
    } catch (_) {
      ov.classList.add('nocam');
      $('#scan-hint', ov).textContent = t('camOff');
    }
  }
  async function shrink(blob) {
    try {
      const bmp = await createImageBitmap(blob); const sc = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    } catch (_) { return blob; }
  }
  async function handleShot(ov, blob) {
    blob = await shrink(blob);
    stopCam();
    const img = $('#shot', ov); img.src = URL.createObjectURL(blob); img.hidden = false;
    ov.classList.add('frozen', 'busy'); ov.classList.remove('live');
    $('#scan-hint', ov).textContent = t('analyzing');
    if (AI.source()) {
      try {
        const r = await AI.json({ system: visionPrompt(), messages: [{ role: 'user', content: 'Analyze this product photo.' }], image: blob });
        ov.classList.remove('busy');
        if (!r || !r.found || !r.name) { $('#scan-hint', ov).textContent = t('notFoundPhoto'); return askName(ov, blob); }
        const label = ((r.brand || '') + ' ' + r.name).trim();
        const known = E.findProduct(label);
        let a;
        if (known) a = E.analyzeProduct(known, S.profile, S.mode);
        else {
          a = E.analyzeProduct(label, S.profile, S.mode);
          a.product.brand = String(r.brand || '').slice(0, 60); a.product.name = String(r.name).slice(0, 100);
          if (r.category && D.CATS[r.category]) { a.product.cat = r.category; }
          if (Array.isArray(r.keyIngredients)) a.ing = a.product.ing = r.keyIngredients.slice(0, 6).map(String);
        }
        if (typeof r.fit === 'number') a.score = Math.max(20, Math.min(98, Math.round(r.fit)));
        if (r.summary) a.aiNote = String(r.summary).slice(0, 400);
        if (Array.isArray(r.why) && r.why.length) a.why = r.why.slice(0, 4).map(String);
        if (Array.isArray(r.caution) && r.caution.length) a.warn = r.caution.slice(0, 4).map(String);
        if (r.how) a.how = String(r.how).slice(0, 300);
        closeOverlay(ov); setTimeout(() => openProduct(a), 200);
        return;
      } catch (e) { ov.classList.remove('busy'); }
    }
    ov.classList.remove('busy');
    askName(ov, blob);
  }
  function visionPrompt() {
    const lang = S.lang === 'tr' ? 'Turkish' : 'English';
    return `You review personal care products for a user. Identify the product in the photo and judge its fit for this user profile: ${JSON.stringify(S.profile)}. App mode: ${S.mode === 'care' ? 'no makeup (skin, hair, grooming only)' : 'makeup, skin and hair'}.
Reply with JSON only:
{"found": true, "brand": "", "name": "", "category": one of ${JSON.stringify(Object.keys(D.CATS))}, "keyIngredients": ["..."], "fit": 0-100, "summary": "one or two sentences in ${lang}", "why": ["short reasons in ${lang}"], "caution": ["short cautions in ${lang}"], "how": "how to use, one sentence in ${lang}"}
If no personal care product is visible or the name can't be read, reply {"found": false}. Don't comment on any person in the photo.`;
  }
  function askName(ov, blob) {
    stopCam();

      <div class="sugg" id="sugg"></div>`;

      const ok = +b.dataset.a === lesson.a;
      const g = b.parentElement; g.classList.add('decided');
      $$('[data-a]', g).forEach(x => { x.disabled = true; x.classList.toggle('right', +x.dataset.a === lesson.a); x.classList.toggle('picked', x === b); });
      if (!ok) b.classList.add('wrong');
      res.textContent = ok ? t('correct') : t('wrong');
      buzz(ok ? 15 : 30);
      completeTask('lesson');
      setTimeout(() => drawStreak(parent), 300);
    });
    $('[data-act=close]', ov).onclick = () => closeOverlay(ov);
  }
  function pickSeries(thenOpen, parent) {
    const ov = overlay(`
      <div class="series-pick">
        <h2>${t('chooseSeries')}</h2>
        <div class="list">
        ${seriesList().map(s => `<button type="button" class="row ${S.streak.series === s.id ? 'on' : ''}" data-s="${s.id}"><span class="row-t"><b>${esc(tx(s.t))}</b><small>${esc(tx(s.d))}</small></span>${S.streak.series === s.id ? ic('check', 'chev') : ic('chev', 'chev')}</button>`).join('')}
        </div>
      </div>`);
    $$('[data-s]', ov).forEach(b => b.onclick = () => {
      buzz();
      if (S.streak.series !== b.dataset.s) {
        S.streak.series = b.dataset.s;
        const s = curSeries(); S.streak.today.lesson = S.streak.doneDays % s.lessons.length;
        save();
      }
      closeOverlay(ov);
      if (thenOpen) setTimeout(openStreak, 260);
      else if (parent) drawStreak(parent);
    });
  }
  function celebrate() {
    toast(t('dayDone') + ' ' + t('dayDoneSub', streakCount()));
    buzz([15, 50, 20]);
  }

  /* ---------- Profil ---------- */
  function renderProfile() {
    const v = $('#view'); const pf = S.profile; const mk = S.mode === 'makeup';
    const group = (key, multi, extra = '') => {
      const opts = D.OPTIONS[key];
      const val = pf[key];
      return `<div class="pf-g"><p class="pf-l">${t(key)}</p><div class="chips ${extra}" data-key="${key}" data-multi="${multi ? 1 : 0}">
        ${opts.map(o => {
          const on = multi ? (val || []).includes(o.id) : val === o.id;
          return `<button type="button" class="chip ${on ? 'on' : ''}" data-v="${o.id}" aria-pressed="${on}">${o.c ? `<i class="sw" style="background:${o.c}"></i>` : ''}${esc(tx(o.l))}</button>`;
        }).join('')}</div></div>`;
    };
    const ai = AI.source();
    v.innerHTML = `
      <section class="page">
        <header class="pf-head">
          <div class="avatar lg" aria-hidden="true"><b>${esc((pf.name || '').trim().charAt(0).toLocaleUpperCase(S.lang === 'tr' ? 'tr-TR' : 'en') || '')}</b></div>
          <div><h1>${t('profileTitle')}</h1><p class="muted">${t('profileSub')}</p></div>
        </header>
        <div class="card">
          <label class="pf-l" for="pf-name">${t('name')}</label>
          <input id="pf-name" class="field" type="text" maxlength="40" placeholder="${t('namePh')}" value="${esc(pf.name || '')}" autocomplete="given-name">
          ${group('skinType', false)}
          ${group('concerns', true)}
          ${group('hairType', false)}
          ${group('scalp', false)}
          ${mk ? group('skinTone', false, 'tones') : ''}
          ${mk ? group('undertone', false) : ''}
          ${mk ? group('makeupStyle', false) : ''}
          ${group('budget', false)}
          <div class="pf-g"><label class="pf-l" for="pf-notes">${t('notes')}</label><textarea id="pf-notes" class="field" rows="3" maxlength="400" placeholder="${t('notesPh')}">${esc(pf.notes || '')}</textarea></div>
          <p class="saved-note" id="saved-note" aria-live="polite"></p>
        </div>

        <h2 class="sec-t">${t('settings')}</h2>
        <div class="card settings">
          <div class="set-row"><span>${t('language')}</span><div class="mini-seg" data-set="lang"><button type="button" data-v="tr" class="${S.lang === 'tr' ? 'on' : ''}">Türkçe</button><button type="button" data-v="en" class="${S.lang === 'en' ? 'on' : ''}">English</button></div></div>
          <div class="set-row"><span>${t('appearance')}</span><div class="mini-seg" data-set="theme">${['system', 'light', 'dark'].map(k => `<button type="button" data-v="${k}" class="${S.settings.theme === k ? 'on' : ''}">${t('theme' + k[0].toUpperCase() + k.slice(1))}</button>`).join('')}</div></div>
          <div class="set-row col"><div class="set-sw"><span>${t('makeupContent')}</span><button type="button" class="switch ${mk ? 'on' : ''}" role="switch" aria-checked="${mk}" data-act="mode"><i></i></button></div><small class="muted">${t('makeupContentSub')}</small></div>
          <div class="set-row col"><div class="set-sw"><span>${t('aiTitle')}</span><span class="status ${ai ? 'on' : ''}">${ai ? t('aiOn') : t('aiOff')}</span></div><small class="muted">${t('aiSub')}</small>
            <input id="pf-key" class="field" type="password" autocomplete="off" spellcheck="false" placeholder="${t('aiKeyPh')}" value="${esc(S.settings.apiKey || '')}"></div>
          <div class="set-row col" id="install-row" hidden><button type="button" class="btn ghost wide" data-act="install">${ic('download')} ${t('install')}</button><small class="muted" id="install-hint"></small></div>
          <div class="set-row col"><button type="button" class="btn danger wide" data-act="reset">${ic('trash')} ${t('reset')}</button><div id="reset-confirm" hidden class="confirm"><p>${t('resetConfirm')}</p><div class="row"><button type="button" class="btn ghost" data-act="cancel">${t('cancel')}</button><button type="button" class="btn danger" data-act="wipe">${t('resetYes')}</button></div></div></div>
          <p class="muted small">${t('privacy')}</p>
        </div>
        <p class="ver muted small center">adorn · v2.1</p>
      </section>`;

    let nt = 0;
    const savedNote = () => { const n = $('#saved-note'); if (!n) return; n.textContent = t('saved'); n.classList.add('show'); clearTimeout(nt); nt = setTimeout(() => n.classList.remove('show'), 1400); };
    $('#pf-name').addEventListener('input', (e) => { pf.name = e.target.value; save(); const b = $('.avatar b'); if (b) b.textContent = pf.name.trim().charAt(0).toLocaleUpperCase(S.lang === 'tr' ? 'tr-TR' : 'en'); });
    $('#pf-name').addEventListener('change', savedNote);
    $('#pf-notes').addEventListener('input', (e) => { pf.notes = e.target.value; save(); });
    $('#pf-notes').addEventListener('change', savedNote);
    $$('[data-key]', v).forEach(g => $$('[data-v]', g).forEach(b => b.onclick = () => {
      const key = g.dataset.key, multi = g.dataset.multi === '1', id = b.dataset.v;
      buzz(5);
      if (multi) {
        const arr = pf[key] = pf[key] || []; const i = arr.indexOf(id);
        if (i >= 0) arr.splice(i, 1); else arr.push(id);
        b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', i < 0);
      } else {
        pf[key] = pf[key] === id ? null : id;
        $$('[data-v]', g).forEach(x => { const on = x.dataset.v === pf[key]; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      }
      save(); savedNote();
    }));
    $$('[data-set]', v).forEach(g => $$('[data-v]', g).forEach(b => b.onclick = () => {
      const k = g.dataset.set, val = b.dataset.v;
      if (k === 'lang') { S.lang = I18N.lang = val; }
      if (k === 'theme') { S.settings.theme = val; }
      save(); applyTheme(); renderShell(); go('profile', true);
    }));
    $('[data-act=mode]', v).onclick = () => {
      S.mode = S.mode === 'makeup' ? 'care' : 'makeup';
      if (S.streak.series && !seriesList().some(s => s.id === S.streak.series)) S.streak.series = null;
      S.quizDone = true; save(); applyTheme(); renderShell(); go('profile', true); buzz();
    };
    $('#pf-key').addEventListener('change', (e) => { S.settings.apiKey = e.target.value.trim(); window.ADORN_KEY = S.settings.apiKey; save(); renderProfile(); });
    $('[data-act=reset]', v).onclick = () => { $('#reset-confirm').hidden = false; };
    $('[data-act=cancel]', v).onclick = () => { $('#reset-confirm').hidden = true; };
    $('[data-act=wipe]', v).onclick = () => { try { localStorage.removeItem(KEY); } catch (_) {} S = fresh(); I18N.lang = S.lang; window.ADORN_KEY = ''; tab = 'chat'; boot(); };
    setupInstall();
  }

  /* ---------- Kurulum ---------- */
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; setupInstall(); });
  function setupInstall() {
    const row = $('#install-row'); if (!row) return;
    const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
    if (standalone) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (deferred || ios) {
      row.hidden = false;
      $('#install-hint').textContent = ios && !deferred ? t('installIOS') : '';
      $('[data-act=install]', row).onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; row.hidden = true; } };
    }
  }

  /* ---------- Klavye / görünüm ---------- */
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const onVV = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
      document.body.classList.toggle('kb-open', kb > 120);
    };
    vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { ensureToday(); updateChip(); } });

  /* ---------- Servis çalışanı ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  boot();
})();

</script>
