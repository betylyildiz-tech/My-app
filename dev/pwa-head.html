
<!-- PWA: ana ekrana kurulum ve sunucusuz çalışma -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Adorn" />
<script>
(function () {
  // GitHub Pages statik barındırmadır, /api sunucusu yoktur. Bu istekleri ağa göndermeden
  // "kullanılamıyor" olarak yanıtla; uygulama kendi yerleşik örnek yanıtlarına geçer.
  var nativeFetch = window.fetch;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var path = url.replace(location.origin, '');
    if (path.indexOf('/api/') === 0) {
      var cap = path.indexOf('/api/capabilities') === 0;
      return Promise.resolve(new Response(cap ? 'null' : '{"code":"not_granted"}', {
        status: cap ? 200 : 503, headers: { 'Content-Type': 'application/json' }
      }));
    }
    return nativeFetch.apply(this, arguments);
  };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    // Yeni sürüm yayınlandığında telefon eskisinde takılı kalmasın: güncelle ve bir kez yenile
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) {
        document.addEventListener('visibilitychange', function () { if (!document.hidden) r.update().catch(function () {}); });
      }).catch(function () {});
    });
  }
})();
</script>
